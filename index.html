    <div style="text-align:center;padding:12px 0 6px 0;">
      <div style="font-size:40px;" class="star-row">${starStr(stars)}</div>
      <h2 style="margin-top:6px;">${Z.correct} / ${n} correct</h2>
      <p>${pct}% accuracy · +${summary.xp} XP · ${Math.max(1,Math.round(secs/60))} min${newBest?' · 🏅 New personal best!':''}</p>
      ${extraHTML}
      ${Z.mastered.length?`<p style="margin-top:8px;">🏆 Mastered: ${Z.mastered.map(k=>esc(TOPICS[k].title)).join(', ')}</p>`:''}
      ${changed.length?`<p style="margin-top:8px;font-size:12.5px;">${changed.join(' · ')}</p>`:''}
      ${weakNow.length?`<div class="card" style="margin-top:12px;text-align:left;background:var(--warn-bg);"><b style="color:var(--text);">Recommended practice</b><p style="color:var(--text);font-size:13px;margin-top:4px;">${weakNow.map(k=>esc(TOPICS[k].title)).join(', ')} needs a bit more practice. It now appears under <b>My Weak Areas</b> on Home.</p></div>`:''}

function weakAreas(limit){
  const out = [];
  for(const k in state.v7.mastery){
    const t = TOPICS[k]; if(!t) continue;
    const s = mstat(k); const mc = missedFor(k).length;
    if(s.weak || mc>=2){ out.push({key:k, acc:s.acc===null?1:s.acc, miss:mc, a:s.a}); }
  }
  out.sort((a,b)=>(a.acc-b.acc) || (b.miss-a.miss));
  return out.slice(0, limit||4);
}
function topicScore(t, goal){
  const s = mstat(t.key); let sc = 1; const why = [];
  if(s.weak){ sc += 3; why.push('Needs practice'); }
  const mc = missedFor(t.key).length;
  if(mc){ sc += Math.min(3, mc); why.push('Review missed questions'); }
  const ds = daysSinceLast(t.key);
  if(ds===null){ sc += 1.5; why.push('New for you'); }
  else if(ds>=7){ sc += 2; why.push('Not practised for '+ds+' days'); }
  else if(ds>=3){ sc += 0.8; }
  if(s.mastered){ sc -= 2.5; }
  const g = String(goal||'');
  const gb = {
    'School Education': ['eng','math','sci'], 'College':['eng','reason','math'], 'Interviews':['eng','reason'],
    'Office Communication':['eng','life'], 'Everyday Conversations':['eng'], 'Professional Development':['reason','fin'],
    'Maths & Reasoning':['math','reason'], 'Money Skills':['fin','life'], 'Exam Preparation':['math','reason','gk'], 'Overall Growth':[]
  }[g] || [];
  if(gb.includes(t.subject)) { sc += 1; }
  return {score:Math.max(0.2, sc), why};
}
function buildTodayPlan(){
  ensureV7();
  const goal = state.profile.objective;
  const young = isYoung();
  const dm = state.profile.dailyMinutes || 15;
  const N = young ? 8 : (dm<=10 ? 10 : dm<=15 ? 12 : 14);
  const core = young ? ['math','eng','reason','gk','sci'] : ['eng','math','reason','gk','sci'];
  const pool = Object.values(TOPICS).filter(t=>topicAllowed(t));
  const scored = pool.map(t=>Object.assign({t}, topicScore(t, goal)));
  const slots = []; const counts = {}; const reasons = {};
  const take = (t, n, why)=>{
    for(let i=0;i<n;i++) slots.push({topic:t.key});
    counts[t.key] = (counts[t.key]||0) + n;
    if(why && why.length && !reasons[t.key]) reasons[t.key] = why[0];
  };
  // 1) one primary topic from each core subject (weighted pick, weak/stale topics favoured)
  core.forEach(sj=>{
    const c = scored.filter(x=>x.t.subject===sj);
    if(!c.length) return;
    const tot = c.reduce((s,x)=>s+x.score,0); let r = Math.random()*tot, chosen = c[0];
    for(const x of c){ r -= x.score; if(r<=0){ chosen = x; break; } }
    take(chosen.t, young?1:2, chosen.why);
  });
  // 2) missed-question review slots (up to 2)
  const miss = state.v7.missed.filter(m=>TOPICS[m.topic]).slice(-6);
  const reviews = rShuf(miss).slice(0, Math.min(2, miss.length));
  // 3) fill the rest with weighted picks (max 3 per topic)
  let guard = 0;
  while(slots.length < N - reviews.length && guard++<200){
    const c = scored.filter(x=>(counts[x.t.key]||0)<3);
    if(!c.length) break;
    const tot = c.reduce((s,x)=>s+x.score,0); let r = Math.random()*tot, chosen = c[0];
    for(const x of c){ r -= x.score; if(r<=0){ chosen = x; break; } }
    take(chosen.t, 1, chosen.why);
  }
  reviews.forEach(m=>slots.push({topic:m.topic, replay:m}));
  // shuffle then avoid same-subject neighbours where possible
  let order = rShuf(slots);
  for(let i=1;i<order.length;i++){
    const sj = k=>TOPICS[k.topic].subject;
    if(sj(order[i])===sj(order[i-1])){
      for(let j=i+1;j<order.length;j++){ if(sj(order[j])!==sj(order[i-1]) && (i+1>=order.length || sj(order[j])!==sj(order[i+1]||{topic:order[j].topic}))){ [order[i],order[j]]=[order[j],order[i]]; break; } }
    }
  }
  const topicList = [];
  order.forEach(s=>{ if(!topicList.includes(s.topic)) topicList.push(s.topic); });
  return {slots:order, topics:topicList.map(k=>({key:k, why:reasons[k]||'Mixed practice'})), reviews:reviews.length, minutes: young?10:Math.max(10, Math.min(15, Math.round(order.length*1.1)))};
}
function openToday(){

const M_MINUS = '−';
function gcd(a,b){ return b?gcd(b,a%b):Math.abs(a); }
function fracStr(n,d){ const g=gcd(n,d); return (n/g)+'/'+(d/g); }
function fmt12(totalMin){
  let m = ((totalMin%1440)+1440)%1440; const h24 = Math.floor(m/60), mm = m%60;
  const ap = h24>=12?'PM':'AM'; const h = h24%12===0?12:h24%12;
  return h+':'+pad2(mm)+' '+ap;
}
function durStr(min){ const h=Math.floor(min/60), m=min%60; return (h?h+' h ':'')+(m?m+' min':(h?'':'0 min')); }

function _h3(a,b,c){ return `<rect width="90" height="20" fill="${a}"/><rect y="20" width="90" height="20" fill="${b}"/><rect y="40" width="90" height="20" fill="${c}"/>`; }

function _h2(a,b){ return `<rect width="90" height="30" fill="${a}"/><rect y="30" width="90" height="30" fill="${b}"/>`; }
const FLAGS = {
  'India': ()=>{ let sp=''; for(let a=0;a<180;a+=15) sp+=`<line x1="45" y1="22" x2="45" y2="38" stroke="#000080" stroke-width=".6" transform="rotate(${a} 45 30)"/>`; return _h3('#FF9933','#FFFFFF','#138808')+`<circle cx="45" cy="30" r="8" fill="none" stroke="#000080" stroke-width="1"/>`+sp; },
  'Japan': ()=>`<rect width="90" height="60" fill="#FFFFFF"/><circle cx="45" cy="30" r="18" fill="#BC002D"/>`,
  'France': ()=>_v3('#0055A4','#FFFFFF','#EF4135'),

  'Germany': ()=>_h3('#000000','#DD0000','#FFCE00'),

const FLAG_LEVELS = {
  1:['India','Japan','France','Italy','Germany','Bangladesh'],
  2:['Netherlands','Ireland','Sweden','Switzerland','Russia','Austria','Ukraine','Belgium'],
  3:['Poland','Indonesia','Hungary','Nigeria','Thailand','Ireland','Netherlands','Belgium','Russia','Austria']
};
const FLAG_LOOKALIKES = { 'Poland':['Indonesia'], 'Indonesia':['Poland'], 'Ireland':['Italy'], 'Italy':['Ireland'], 'Netherlands':['Russia'], 'Russia':['Netherlands'], 'Hungary':['Italy','Austria'], 'Belgium':['Germany'], 'Germany':['Belgium'], 'Austria':['Hungary'] };
function flagHTML(name, w){
  const f = FLAGS[name]; if(!f) return '';
  const width = w || 150, height = Math.round(width*2/3);
  return `<span class="flag-box" role="img" aria-label="Flag"><svg viewBox="0 0 90 60" width="${width}" height="${height}" xmlns="http://www.w3.org/2000/svg">${f()}</svg></span>`;
}
regTopic('gk_flags','gk','Flags of the World','🚩',[2,5],(lvl,simple)=>{
  const want = simple?1:lvl;
  const name = rPick(FLAG_LEVELS[want]);
  const look = (FLAG_LOOKALIKES[name]||[]).filter(x=>x!==name);
  const rest = rShuf(Object.keys(FLAGS).filter(x=>x!==name && !look.includes(x)));
  const wrongs = (lvl===3 ? look.concat(rest) : rest).slice(0,3);
  return mk('Which country does this flag belong to?', name, wrongs, `This is the flag of ${name}. Tip: look at the colours, the direction of the stripes and any symbol.`, {visual:flagHTML(name,160), say:'Which country does this flag belong to?'});
});

function clockSvg(h, m, size){
  const z = size || 150;
  const ha = ((h%12)+m/60)*30, ma = m*6;
  let ticks = '';
  for(let i=1;i<=12;i++){ const a=i*30*Math.PI/180; ticks += `<text x="${50+36*Math.sin(a)}" y="${50-36*Math.cos(a)+4}" font-size="11" font-weight="700" text-anchor="middle" fill="#1C2140" font-family="Arial">${i}</text>`; }
  return `<svg viewBox="0 0 100 100" width="${z}" height="${z}" role="img" aria-label="Clock"><circle cx="50" cy="50" r="47" fill="#fff" stroke="#3B5BFE" stroke-width="4"/>${ticks}
    <line x1="50" y1="50" x2="${50+22*Math.sin(ha*Math.PI/180)}" y2="${50-22*Math.cos(ha*Math.PI/180)}" stroke="#1C2140" stroke-width="5" stroke-linecap="round"/>
    <line x1="50" y1="50" x2="${50+33*Math.sin(ma*Math.PI/180)}" y2="${50-33*Math.cos(ma*Math.PI/180)}" stroke="#EF4444" stroke-width="3" stroke-linecap="round"/>
    <circle cx="50" cy="50" r="3.5" fill="#1C2140"/></svg>`;
}
function timeWords(h, m){
  const nx = h%12+1;
  if(m===0) return `${h} o'clock`;
  if(m===30) return `half past ${h}`;
  if(m===15) return `quarter past ${h}`;
  if(m===45) return `quarter to ${nx}`;
  return m<30 ? `${m} past ${h}` : `${60-m} to ${nx}`;
}

function drawKidsMemory(){
  const K = kmem, body = document.getElementById('rhymesTabBody');

function nextKidsSpell(){

  const w = S.words[S.i][1];

    <div style="margin-top:12px;display:flex;gap:8px;justify-content:center;"><button class="btn btn-soft btn-sm" id="ksUndo">⌫ Undo</button><button class="btn btn-soft btn-sm" id="ksClear">🔄 Clear</button></div>
    <div id="ksMsg" style="margin-top:10px;font-weight:700;min-height:26px;"></div>

/* ====================================================================
   SPEAKING PRACTICE (enhanced)
   Uses the browser's built-in speech synthesis (listen) and — where the
   browser supports it — speech recognition + audio recording. If the
   browser cannot hear you, every activity lets you TYPE what you said.
   All feedback is an approximate, rule-based check — NOT a certified
   pronunciation or fluency score. Sample answers are labelled samples.
==================================================================== */
let speakMode = 'sentences';
const SPEAK_MODES = [
  ['sentences','📝 Sentences',0],['lrr','🎧 Listen → Repeat → Record',0],['pron','🔊 Pronunciation',0],
  ['picture','🖼️ Picture description',0],['retell','📖 Story retelling',0],['convo','💬 Daily conversations',0],
  ['public','🎤 Public speaking',3],['interview','💼 Interview practice',3],['present','📊 Presentation practice',3]
];
const SP_STOP = new Set('the a an and or but if then so to of in on at for with from by as is are was were be been being am do does did have has had it its this that these those i you he she we they me him her us them my your his our their will would can could should may might not no yes very just also than too there here when where what who which while into out up down over after before because about again once more some any each all'.split(' '));
function normWords(t){ return String(t||'').toLowerCase().replace(/[^a-z0-9'\s]/g,' ').split(/\s+/).filter(Boolean); }
function spBlank(s){ return String(s).replace(/___/g,'…'); }
function compareWords(target, said){
  const tw = normWords(String(target).replace(/___/g,' ')); const sw = new Set(normWords(said));
  const tokens = tw.map(w=>({w, ok:sw.has(w)})); const ok = tokens.filter(t=>t.ok).length;
  return {pct: tw.length ? Math.round(ok/tw.length*100) : 0, tokens};
}
function tokensHTML(tokens){ return tokens.map(t=>`<span class="${t.ok?'w-ok':'w-miss'}">${esc(t.w)}</span>`).join(' '); }
const SP_FILLERS = ['um','uh','er','erm','like','you know','actually','basically','kind of','sort of'];
function countFillers(t){
  const s = ' '+normWords(t).join(' ')+' '; const found = {}; let total = 0;
  SP_FILLERS.forEach(f=>{ const n = (s.match(new RegExp(' '+f+' ','g'))||[]).length; if(n){ found[f]=n; total+=n; } });
  return {total, found};
}
function keywordCoverage(keys, said){
  const set = new Set(normWords(said));
  const hits = keys.map(k=>({w:k, ok: normWords(k).every(x=>set.has(x)) || set.has(String(k).toLowerCase())}));
  return {hits, n:hits.filter(h=>h.ok).length};
}
function storyKeywords(text, n){
  const seen = new Set(), out = [];
  normWords(text).forEach(w=>{ if(w.length>=5 && !SP_STOP.has(w) && !seen.has(w)){ seen.add(w); out.push(w); } });
  if(out.length<=n) return out;
  const step = out.length/n; const pick = []; for(let i=0;i<n;i++) pick.push(out[Math.floor(i*step)]);
  return pick;
}
function spXP(key, xp){
  ensureV7();
  if(!state.v7.spoken[key]){ state.v7.spoken[key] = 1; awardXP(xp); saveState(); return true; }
  return false;
}
function spCount(text){
  if(normWords(text).length>=3){ state.v7.speakCount++; v7CheckBadges(); saveState(); }
}
/* continuous recognition helper (the original startRecognition is single-phrase) */
function v7Recognize(onText, onEnd, continuous){
  if(!SR){ if(onEnd) onEnd(''); return null; }
  const rec = new SR(); rec.lang = 'en-US'; rec.interimResults = true; rec.continuous = !!continuous;
  let finalText = '';
  rec.onresult = e=>{ let interim=''; for(let i=e.resultIndex;i<e.results.length;i++){ const r=e.results[i]; if(r.isFinal) finalText += r[0].transcript+' '; else interim += r[0].transcript; } onText((finalText+interim).trim()); };
  rec.onerror = ()=>{ toast('Could not hear you clearly — try again or type below.','error'); };
  rec.onend = ()=>{ if(onEnd) onEnd(finalText.trim()); };
  try{ rec.start(); }catch(e){ toast('Microphone could not be started — please type below.','error'); if(onEnd) onEnd(''); return null; }
  return rec;
}
function recorderHTML(id, label){
  return `<div id="${id}" class="card" style="background:var(--surface-2);margin-top:12px;">
    <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center;">

    <div data-r="audio"></div>

    <button class="btn btn-soft btn-sm" data-r="check" style="margin-top:8px;">✅ Check my speaking</button>

}
function wireRecorder(id, opts){
  const root = document.getElementById(id); if(!root) return;
  const $ = k=>root.querySelector(`[data-r="${k}"]`);
  let rec = null, t0 = 0, running = false;
  const finish = ()=>{ running=false; $('start').disabled=false; $('stop').disabled=true; $('status').textContent = 'Done — check your words below.'; stopAudioRecording(); };
  $('start').addEventListener('click', ()=>{
    stopSpeak(); if(running) return; running = true; t0 = Date.now(); $('text').value=''; $('audio').innerHTML='';
    $('start').disabled=true; $('stop').disabled=false; $('status').innerHTML = '<span class="rec-dot"></span> Listening…';
    startAudioRecording(url=>{ if(url) $('audio').innerHTML = `<p style="font-size:11.5px;margin:8px 0 4px 0;">Hear yourself back:</p><audio controls src="${url}" style="width:100%;"></audio>`; });
    rec = v7Recognize(txt=>{ $('text').value = txt; }, txt=>{ if(txt) $('text').value = txt; if(running){ finish(); if(opts.onCheck && $('text').value.trim()) opts.onCheck($('text').value.trim(), Math.round((Date.now()-t0)/1000)); } }, !!opts.continuous);
    if(!rec){ running=false; $('start').disabled=false; $('stop').disabled=true; $('status').textContent='Type what you said below, then tap Check.'; stopAudioRecording(); }
  });
  $('stop').addEventListener('click', ()=>{ if(rec){ try{ rec.stop(); }catch(e){} } else { finish(); } });
  $('check').addEventListener('click', ()=>{
    const txt = $('text').value.trim(); if(!txt){ toast('Say or type something first.','error'); return; }
    opts.onCheck(txt, t0 ? Math.max(1, Math.round((Date.now()-t0)/1000)) : 0);
  });
  window._recStop = ()=>{ try{ if(rec) rec.stop(); }catch(e){} stopAudioRecording(); };
}

function renderSpeak(){
  ensureV7();
  const modes = SPEAK_MODES.filter(m=> state.v7.showAll || bandIdx()>=m[2]);
  if(!modes.find(m=>m[0]===speakMode)) speakMode = 'sentences';
  document.getElementById('view-speak').innerHTML = `
    <div class="page-head"><h2>Speaking Practice</h2><p>Listen, repeat, record and improve — sentences, pronunciation, pictures, stories, conversations, speeches, interviews and presentations.</p></div>
    <div class="kid-tabs" id="speakModeRow">${modes.map(m=>`<button type="button" class="chip-opt ${speakMode===m[0]?'selected':''}" data-sm="${m[0]}">${m[1]}</button>`).join('')}</div>
    <div id="speakModeBody"></div>`;
  document.querySelectorAll('#speakModeRow [data-sm]').forEach(b=>b.addEventListener('click', ()=>{ speakMode=b.getAttribute('data-sm'); stopSpeak(); renderSpeak(); }));
  const fn = {lrr:spLRR, pron:spPron, picture:spPicture, retell:spRetell, convo:spConvo, public:spPublic, interview:spInterview, present:spPresent}[speakMode];
  if(speakMode==='sentences') renderSpeakSentences(); else fn(document.getElementById('speakModeBody'));
}

/* ---------------- 1. Listen → Repeat → Record ---------------- */
let lrr = {topicId:null, idx:0, step:1};
function spLRR(body){
  if(!lrr.topicId) lrr.topicId = SPEAKING_TOPICS[0].id;
  const topic = SPEAKING_TOPICS.find(t=>t.id===lrr.topicId); const sent = spBlank(topic.sentences[lrr.idx]);
  const steps = [['1 · Listen',1],['2 · Repeat',2],['3 · Record',3]];
  body.innerHTML = `
    <div class="card"><label class="field-label" style="margin-top:0;">Topic</label>
      <select id="lrrTopic">${SPEAKING_TOPICS.map(t=>`<option value="${t.id}" ${t.id===lrr.topicId?'selected':''}>${esc(t.title)}</option>`).join('')}</select></div>
    <div class="card" style="margin-top:12px;text-align:center;">
      <div class="step-row">${steps.map(s=>`<span class="step-chip ${lrr.step===s[1]?'on':(lrr.step>s[1]?'done':'')}">${lrr.step>s[1]?'✓ ':''}${s[0]}</span>`).join('')}</div>
      <span class="pill pill-blue">Sentence ${lrr.idx+1} of ${topic.sentences.length}</span>
      <h3 style="font-size:20px;margin-top:10px;">"${esc(sent)}"</h3>
      ${topic.sentences[lrr.idx].includes('___')?'<p style="font-size:11.5px;margin-top:4px;">Fill the “…” with your own word.</p>':''}
      <div id="lrrStep" style="margin-top:14px;"></div>
    </div>`;
  document.getElementById('lrrTopic').addEventListener('change', e=>{ lrr.topicId=e.target.value; lrr.idx=0; lrr.step=1; spLRR(body); });
  const stepEl = document.getElementById('lrrStep');
  const teacher = TEACHERS.find(t=>t.id==='sarah') || TEACHERS[0]; const lang = englishVoiceFor(teacher);
  if(lrr.step===1){
    stepEl.innerHTML = `<p>First, just <b>listen</b> carefully to the model sentence.</p>
      <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:8px;"><button class="btn btn-primary" id="lrrPlay">🔊 Listen</button><button class="btn btn-soft" id="lrrNext1">I'm ready to repeat →</button></div>`;
    document.getElementById('lrrPlay').addEventListener('click', ()=>speak(sent, lang));
    document.getElementById('lrrNext1').addEventListener('click', ()=>{ lrr.step=2; spLRR(body); });
    speak(sent, lang);
  } else if(lrr.step===2){
    stepEl.innerHTML = `<p>Now <b>repeat</b> it out loud — slowly first, then at normal speed.</p>
      <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:8px;"><button class="btn btn-outline" id="lrrSlow">🐢 Slow model</button><button class="btn btn-outline" id="lrrNorm">▶ Normal model</button><button class="btn btn-primary" id="lrrNext2">Next: record yourself →</button></div>`;
    const withRate = (r)=>{ const old = state.speakRate; state.speakRate = r; speak(sent, lang); state.speakRate = old; };
    document.getElementById('lrrSlow').addEventListener('click', ()=>withRate(0.65));
    document.getElementById('lrrNorm').addEventListener('click', ()=>withRate(0.95));
    document.getElementById('lrrNext2').addEventListener('click', ()=>{ lrr.step=3; spLRR(body); });
  } else {
    stepEl.innerHTML = `<p>Now <b>record</b> the sentence in your own voice.</p>${recorderHTML('lrrRec','Record')}<div id="lrrRes"></div>
      <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px;"><button class="btn btn-soft" id="lrrAgain">↺ Try this sentence again</button><button class="btn btn-primary" id="lrrNextS">Next sentence ▶</button></div>`;
    wireRecorder('lrrRec', {onCheck:(txt)=>{
      const c = compareWords(sent, txt);
      spResult('lrrRes', `<div class="card" style="margin-top:12px;text-align:left;"><p style="font-size:12px;">Words you said <span class="w-ok">green</span> · words to practise <span class="w-miss">red</span></p><p style="margin-top:6px;">${tokensHTML(c.tokens)}</p>
        <div class="progress-track" style="margin-top:8px;"><div class="progress-fill" style="width:${c.pct}%;"></div></div><p style="font-size:12px;margin-top:6px;"><b style="color:var(--text);">${c.pct}%</b> word match — ${c.pct>=80?'excellent! 🎉':c.pct>=50?'good effort, try once more':'listen again and try slowly'}.</p>
        <p style="font-size:11px;margin-top:6px;">Approximate word match only — not a certified pronunciation score.</p></div>`);
      spCount(txt); markSentencePracticed(lrr.topicId, lrr.idx); spXP('lrr:'+lrr.topicId+':'+lrr.idx, 2);
    }});
    document.getElementById('lrrAgain').addEventListener('click', ()=>{ lrr.step=1; spLRR(body); });
    document.getElementById('lrrNextS').addEventListener('click', ()=>{ lrr.idx=(lrr.idx+1)%topic.sentences.length; lrr.step=1; spLRR(body); });
  }
}

/* ---------------- 2. Pronunciation ---------------- */
const PRON_WORDS = [
  {w:'ship',ipa:'/ʃɪp/',tip:'Short "i" sound — don\'t say "sheep".'},{w:'sheep',ipa:'/ʃiːp/',tip:'Long "ee" sound — stretch the vowel.'},
  {w:'think',ipa:'/θɪŋk/',tip:'Put the tongue lightly between your teeth for "th" (no voice).'},{w:'this',ipa:'/ðɪs/',tip:'Voiced "th": tongue between teeth and let your voice buzz.'},
  {w:'three',ipa:'/θriː/',tip:'Start with "th", not "t" — then "ree".'},{w:'very',ipa:'/ˈveri/',tip:'Top teeth touch the lower lip for "v".'},
  {w:'world',ipa:'/wɜːld/',tip:'Round your lips for "w", then "ur", then "ld".'},{w:'vegetable',ipa:'/ˈvedʒ.tə.bəl/',tip:'Usually 3 beats: VEJ-tuh-bul.'},
  {w:'comfortable',ipa:'/ˈkʌmf.tə.bəl/',tip:'Usually 3 beats: KUMF-tuh-bul.'},{w:'Wednesday',ipa:'/ˈwenz.deɪ/',tip:'The first "d" is silent: WENZ-day.'},
  {w:'February',ipa:'/ˈfeb.ru.er.i/',tip:'Say the first "r": FEB-roo-ery.'},{w:'schedule',ipa:'/ˈʃed.juːl/ or /ˈsked.juːl/',tip:'Both British "SHED-yool" and American "SKED-jool" are fine.'},
  {w:'thorough',ipa:'/ˈθʌr.ə/',tip:'Sounds like "THUR-uh".'},{w:'focus',ipa:'/ˈfoʊ.kəs/',tip:'Stress the first beat: FOH-kus.'},
  {w:'right',ipa:'/raɪt/',tip:'Curl the tongue back for "r".'},{w:'light',ipa:'/laɪt/',tip:'Tongue tip touches the ridge behind the top teeth for "l".'}
];
let pronIdx = 0;
function spPron(body){
  const p = PRON_WORDS[pronIdx];
  body.innerHTML = `<div class="card"><p style="font-size:12.5px;margin-bottom:8px;">Choose a word, listen, then say it. We check if we heard the same word.</p>
    <div class="chip-select">${PRON_WORDS.map((x,i)=>`<button type="button" class="chip-opt ${i===pronIdx?'selected':''}" data-pw="${i}">${esc(x.w)}${state.v7.spoken['pron:'+x.w]?' ✓':''}</button>`).join('')}</div></div>
    <div class="card" style="margin-top:12px;text-align:center;">
      <h2 style="font-size:36px;">${esc(p.w)}</h2><p style="font-size:16px;color:var(--text);">${esc(p.ipa)}</p><p style="margin-top:6px;">💡 ${esc(p.tip)}</p>
      <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px;"><button class="btn btn-primary" id="pwListen">🔊 Listen</button><button class="btn btn-outline" id="pwSlow">🐢 Slow</button></div>
      ${recorderHTML('pwRec','Say it')}<div id="pwRes"></div></div>`;
  body.querySelectorAll('[data-pw]').forEach(b=>b.addEventListener('click', ()=>{ pronIdx=parseInt(b.getAttribute('data-pw')); spPron(body); }));
  document.getElementById('pwListen').addEventListener('click', ()=>speak(p.w,'en-US'));
  document.getElementById('pwSlow').addEventListener('click', ()=>{ const o=state.speakRate; state.speakRate=0.55; speak(p.w,'en-US'); state.speakRate=o; });
  wireRecorder('pwRec', {onCheck:(txt)=>{
    const words = normWords(txt); const ok = words.includes(p.w.toLowerCase());
    spResult('pwRes', `<div class="card" style="margin-top:10px;text-align:left;background:${ok?'var(--success-bg)':'var(--warn-bg)'};"><p style="color:var(--text);">We heard: <b>"${esc(txt)}"</b></p><p style="color:var(--text);margin-top:4px;">${ok?'✅ That matches <b>'+esc(p.w)+'</b>. Well done!':'Not the same word yet. Listen again, follow the tip, and retry.'}</p><p style="font-size:11px;margin-top:4px;">Approximate check using your browser\'s speech recognition.</p></div>`);
    spCount(txt); if(ok && spXP('pron:'+p.w, 2)) { saveState(); }
  }});
}

let picIdx = 0;
function spPicture(body){
  const s = PICTURE_SCENES[picIdx];
  body.innerHTML = `<div class="card"><div class="chip-select">${PICTURE_SCENES.map((x,i)=>`<button type="button" class="chip-opt ${i===picIdx?'selected':''}" data-pic="${i}">${esc(x.title)}${state.v7.spoken['pic:'+x.id]?' ✓':''}</button>`).join('')}</div></div>
    <div class="card" style="margin-top:12px;text-align:center;">
      <div style="font-size:54px;line-height:1.3;">${s.emoji}</div><h3 style="margin-top:4px;">${esc(s.title)}</h3>
      <p style="margin-top:6px;">Describe the picture in 3 sentences: <b>Who</b> is there? <b>Where</b> are they? <b>What</b> are they doing?</p>
      <p style="font-size:12px;margin-top:8px;">Helpful words:</p><div style="display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:4px;">${s.keys.map(k=>`<span class="sub-pill">${esc(k)}</span>`).join('')}</div>
      <button class="btn btn-soft btn-sm" style="margin-top:10px;" id="picSample">🔊 Hear a sample description</button><p style="font-size:11px;margin-top:4px;">(Sample answer written for this app — yours can be different.)</p>
      ${recorderHTML('picRec','Describe it')}<div id="picRes"></div></div>`;

  document.getElementById('picSample').addEventListener('click', ()=>speak(s.sample,'en-US'));
  wireRecorder('picRec', {continuous:true, onCheck:(txt)=>{
    const cov = keywordCoverage(s.keys, txt); const wc = normWords(txt).length; const sentences = txt.split(/[.!?]+/).filter(x=>x.trim().length>2).length || (wc>8?1:0);
    const tips = []; if(wc<12) tips.push('Add more detail — aim for about 15–25 words.'); if(cov.n<3) tips.push('Try using more of the helpful words.'); if(!/\b(is|are|can see|there is|there are)\b/i.test(txt)) tips.push('Start with “I can see…” or “There is/are…”.'); if(!tips.length) tips.push('Great description! Try adding colours, feelings or what might happen next.');
    spResult('picRes', `<div class="card" style="margin-top:12px;text-align:left;"><p style="color:var(--text);">You said: <i>"${esc(txt)}"</i></p><p style="margin-top:8px;">Helpful words used: <b style="color:var(--text);">${cov.n}/${s.keys.length}</b></p><p style="margin-top:4px;">${cov.hits.map(h=>`<span class="${h.ok?'w-ok':'w-miss'}">${esc(h.w)}</span>`).join(' ')}</p><p style="margin-top:8px;">${wc} words · about ${sentences} sentence${sentences===1?'':'s'}</p><ul style="margin:6px 0 0 18px;font-size:13px;color:var(--text);">${tips.map(t=>`<li>${t}</li>`).join('')}</ul></div>`);
    spCount(txt); if(cov.n>=3 && wc>=10) spXP('pic:'+s.id, 4);
  }});
}

/* ---------------- 4. Story retelling ---------------- */
let retellIdx = 0;
function spRetell(body){
  const list = STORIES; const st = list[Math.min(retellIdx, list.length-1)];
  const keys = storyKeywords(st.text, 10);
  body.innerHTML = `<div class="card"><label class="field-label" style="margin-top:0;">Choose a story</label>
    <select id="rtStory">${list.map((s,i)=>`<option value="${i}" ${i===retellIdx?'selected':''}>${esc(s.title)} (${esc(s.level)})</option>`).join('')}</select></div>
    <div class="card" style="margin-top:12px;"><h3>${esc(st.title)}</h3>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin:8px 0;"><button class="btn btn-primary" id="rtListen">🔊 Listen to the story</button><button class="btn btn-soft" id="rtToggle">👁️ Show / hide the text</button></div>
      <p id="rtText" class="hidden" style="color:var(--text);line-height:1.7;">${esc(st.text)}</p>
      <p style="margin-top:10px;">Now <b>retell the story in your own words</b>. Try to say who, what happened, and how it ended.</p>
      ${recorderHTML('rtRec','Retell')}<div id="rtRes"></div></div>`;
  document.getElementById('rtStory').addEventListener('change', e=>{ retellIdx=parseInt(e.target.value); spRetell(body); });
  document.getElementById('rtListen').addEventListener('click', ()=>speak(st.text,'en-US'));
  document.getElementById('rtToggle').addEventListener('click', ()=>document.getElementById('rtText').classList.toggle('hidden'));
  wireRecorder('rtRec', {continuous:true, onCheck:(txt)=>{
    const cov = keywordCoverage(keys, txt); const pct = Math.round(cov.n/keys.length*100); const wc = normWords(txt).length;
    spResult('rtRes', `<div class="card" style="margin-top:12px;text-align:left;"><p>Story details you included: <b style="color:var(--text);">${cov.n}/${keys.length} (${pct}%)</b></p><div class="progress-track" style="margin-top:6px;"><div class="progress-fill" style="width:${pct}%;"></div></div><p style="margin-top:8px;">${cov.hits.map(h=>`<span class="${h.ok?'w-ok':'w-miss'}">${esc(h.w)}</span>`).join(' ')}</p><p style="margin-top:8px;font-size:13px;color:var(--text);">${wc} words. ${pct>=60?'Very good retelling! 🎉':pct>=30?'Good start — try to include the red words too.':'Listen once more, then retell using the key words above.'}</p><p style="font-size:11px;margin-top:4px;">We compare your words with the story's key words — a simple guide, not a grade.</p></div>`);
    spCount(txt); if(pct>=30) spXP('retell:'+st.id, 5);
  }});
}

/* ---------------- timer helper ---------------- */
let spTimer = null;
function spStartTimer(elId, secs, onTick, onEnd){
  clearInterval(spTimer); let left = secs;
  const el = ()=>document.getElementById(elId);
  const draw = ()=>{ const e=el(); if(e) e.textContent = Math.floor(left/60)+':'+pad2(left%60); };
  draw();
  spTimer = setInterval(()=>{ left--; draw(); if(onTick) onTick(left); if(left<=0){ clearInterval(spTimer); if(onEnd) onEnd(); } }, 1000);
}
function spStopTimer(){ clearInterval(spTimer); }
function speechStats(txt, secs){
  const wc = normWords(txt).length; const f = countFillers(txt);
  const wpm = secs>=5 ? Math.round(wc/(secs/60)) : null;
  return {wc, f, wpm};
}
function statsHTML(st){
  const pace = st.wpm===null ? '' : (st.wpm<100 ? 'a little slow — try to speed up slightly' : st.wpm>170 ? 'quite fast — slow down and pause' : 'a comfortable pace');
  return `<div class="grid grid-3" style="margin-top:8px;"><div class="card" style="text-align:center;"><h3>${st.wc}</h3><p style="font-size:11.5px;">words</p></div><div class="card" style="text-align:center;"><h3>${st.wpm===null?'—':st.wpm}</h3><p style="font-size:11.5px;">words / min</p></div><div class="card" style="text-align:center;"><h3>${st.f.total}</h3><p style="font-size:11.5px;">filler words</p></div></div>
    <p style="font-size:12.5px;margin-top:8px;color:var(--text);">${st.wpm!==null?'Pace: '+pace+' (about 110–150 words per minute is comfortable). ':''}${st.f.total? 'Fillers heard: '+Object.entries(st.f.found).map(([k,v])=>`“${k}” ×${v}`).join(', ')+'. Pause silently instead.':'No filler words detected — nice!'}</p><p style="font-size:11px;margin-top:4px;">Approximate counts from speech recognition or your typed text — a guide only.</p>`;
}

function wireLessonPage(){
  const kind = LP.kind, l = LESSON_SRC[kind] && LESSON_SRC[kind]().find(x=>x.id===LP.id); if(!l) return;
  const redo = ()=>{ renderView(VIEW_OF[kind]); };
  const hear = document.getElementById('lpHear');
  if(hear) hear.addEventListener('click', ()=>{ const c=l.cards[LP.i]; speak(c.h+'. '+lessonText(kind,c), 'en-US'); });
  const prev = document.getElementById('lpPrev'); if(prev) prev.addEventListener('click', ()=>{ LP.i=Math.max(0,LP.i-1); redo(); });
  const next = document.getElementById('lpNext');
  if(next) next.addEventListener('click', ()=>{
    if(LP.i<l.cards.length-1){ LP.i++; redo(); }
    else { markLessonDone(kind, l.id); toast('Great! Try the tap-and-explore section or the quiz.','success'); redo(); }
  });
  const done = document.getElementById('lpDone'); if(done) done.addEventListener('click', ()=>{ markLessonDone(kind,l.id); redo(); });
  document.querySelectorAll('#lpTaps [data-tap]').forEach(b=>b.addEventListener('click', ()=>{
    const t = l.taps[parseInt(b.getAttribute('data-tap'))];
    document.getElementById('lpTapOut').innerHTML = `<b style="font-size:16px;">${t[0]} ${esc(t[1])}</b><br>${esc(t[2])}`;

}

/* ---------- calculators ---------- */
function calcHTML(id, spec){
  const fields = spec.fields.map(f=>{
    const lab = `<label class="field-label" style="margin-top:0;font-size:11.5px;">${esc(f[1])}</label>`;
    if(f[3]==='sel') return `<div>${lab}<select data-f="${f[0]}">${f[4].map(o=>`<option value="${o[0]}" ${o[0]===f[2]?'selected':''}>${o[1]}</option>`).join('')}</select></div>`;
    if(f[3]==='time') return `<div>${lab}<input type="time" data-f="${f[0]}" value="${f[2]}"></div>`;
    return `<div>${lab}<input type="number" inputmode="decimal" step="any" min="0" data-f="${f[0]}" value="${f[2]}"></div>`;
  }).join('');
  return `<div class="card" style="margin-top:12px;" id="calc-${id}"><h4>🧮 ${esc(spec.title)}</h4><div class="calc-grid" style="margin-top:8px;">${fields}</div><button class="btn btn-primary btn-sm" style="margin-top:10px;" data-calc-run>Calculate</button><div class="calc-out" data-calc-out>Change the numbers and tap Calculate.</div></div>`;
}
function wireCalc(id, spec){
  const root = document.getElementById('calc-'+id); if(!root) return;
  const out = root.querySelector('[data-calc-out]');
  root.querySelector('[data-calc-run]').addEventListener('click', ()=>{
    const v = {}; let bad = false;
    spec.fields.forEach(f=>{
      const el = root.querySelector('[data-f="'+f[0]+'"]');
      if(f[3]==='sel'||f[3]==='time'){ v[f[0]] = el.value; if(f[3]==='time' && !el.value) bad = true; }
      else { v[f[0]] = parseFloat(el.value); if(isNaN(v[f[0]]) || v[f[0]]<0) bad = true; }
    });
    if(bad){ out.textContent = 'Please fill every box with a valid, non-negative number.'; return; }
    try{ out.innerHTML = spec.run(v); }catch(e){ out.textContent = 'Could not calculate — please check the numbers.'; }
    state.v7.spoken['calc:'+id] = 1; saveState();
  });
}

    return `After ${v.d1}% off: ${fm(a)} (you save ${fm(v.price-a)})<br>After extra ${v.d2}%: <b>${fm(b)}</b><br>Total saving = <b>${fm(v.price-b)}</b> — equal to a single discount of <b>${r2(eq)}%</b>, not ${v.d1+v.d2}%.`; }},
  percent:{title:'Percentage toolkit', fields:[['a','Number A',250],['b','Number B',50],['p','Percent P',12]], run:v=>{

  profit:{title:'Profit & loss', fields:[['cp','Cost price (₹)',800],['sp','Selling price (₹)',920]], run:v=>{
    if(!v.cp) return 'Cost price cannot be zero.'; const d=v.sp-v.cp;

  si:{title:'Simple interest', fields:[['P','Principal (₹)',10000],['R','Rate (% per year)',7],['T','Time (years)',3]], run:v=>{
    const si=v.P*v.R*v.T/100; return `SI = P × R × T ÷ 100 = ${fm(v.P)} × ${v.R} × ${v.T} ÷ 100 = <b>${fm(si)}</b><br>Amount after ${v.T} year(s) = <b>${fm(v.P+si)}</b>`; }},
  time:{title:'Time between two clocks', fields:[['t1','Start time','09:15','time'],['t2','End time','13:40','time']], run:v=>{

/* ====================================================================
   LOCAL-DATE HELPERS (override the original UTC versions — India is UTC+5:30,
   so toISOString() gave the wrong "today" in the early morning)
==================================================================== */
function todayStr(){ return localISO(new Date()); }
function markActiveToday(){
  const today = todayStr();
  if(state.progress.lastActiveDate === today) return;
  const y = new Date(); y.setDate(y.getDate()-1);
  const yesterday = localISO(y);
  if(state.progress.lastActiveDate === yesterday){ state.progress.streak += 1; }
  else { state.progress.streak = 1; }
  state.progress.lastActiveDate = today;
  if(!state.progress.activeDays.includes(today)) state.progress.activeDays.push(today);
  checkBadges();
  saveState();
}
function last7Days(){
  const days=[];
  for(let i=6;i>=0;i--){ const d=new Date(); d.setDate(d.getDate()-i); days.push({iso:localISO(d), label:d.toLocaleDateString('en-US',{weekday:'short'}).slice(0,2), full:d.toLocaleDateString('en-US',{weekday:'short'})}); }
  return days;
}

function tkBuild(){
  if(!TK.topics.length){ toast('Choose at least one topic first.','error'); return; }
  const qs = [], seen = new Set(); let guard = 0;
  while(qs.length<TK.n && guard++ < TK.n*15){
    const key = TK.topics[guard % TK.topics.length];
    const lvl = TK.diff==='mixed' ? rInt(1,3) : ({easy:1,medium:2,hard:3})[TK.diff];
    let q; try{ q = TOPICS[key].gen(lvl,false); }catch(e){ continue; }
    if(!validQ(q) || q.memory) continue;
    const sig = key+'|'+q.q+'|'+(q.visual||'')+'|'+q.options[q.answer];
    if(seen.has(sig)) continue; seen.add(sig);
    q.topic = key; q.level = lvl; qs.push(q);
  }
  if(qs.length<TK.n && qs.length===0){ toast('Could not generate questions — try other topics.','error'); return; }
  const short = qs.length<TK.n;
  TK.gen = {qs: TK.type==='revision' ? qs.slice().sort((a,b)=>TOPICS[a.topic].subject.localeCompare(TOPICS[b.topic].subject)) : qs, type:TK.type, diff:TK.diff, title:TK.title, date:new Date().toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'}), short};
  tkShow();
  if(short) toast('Only '+qs.length+' distinct questions were available for these topics.','error');
  document.getElementById('tkOut').scrollIntoView({behavior:'smooth'});
}

      holder.innerHTML = `<div class="card" style="max-width:560px;margin-top:16px;"><h4>🎂 Age & modules</h4><p style="font-size:12.5px;margin:4px 0 8px 0;">Age decides which modules and difficulty EduQuest shows (currently <b>${esc(BAND_INFO[state.v7.band].label)}</b>).</p>
        <label class="field-label" style="margin-top:0;" for="pfAge">Age</label><input type="number" id="pfAge" min="1" max="110" value="${state.v7.age===null?'':state.v7.age}" placeholder="e.g. 8">
        <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;"><button class="btn btn-primary btn-sm" id="pfAgeSave">Save age</button><button class="btn btn-soft btn-sm" id="pfShowAll">${state.v7.showAll?'Show only my age modules':'Show all modules'}</button></div></div>`;
      if(first && first.parentNode) first.parentNode.insertBefore(holder.firstElementChild, first.nextSibling);
      document.getElementById('pfAgeSave').addEventListener('click', ()=>{ const raw=document.getElementById('pfAge').value.trim(); if(raw!=='' && (isNaN(parseInt(raw))||parseInt(raw)<1||parseInt(raw)>110)){ toast('Please enter an age between 1 and 110.','error'); return; } v7SetProfileAge(raw===''?null:raw); toast('Age saved','success'); renderProfile(); v7DecorateExtra('profile'); });
      document.getElementById('pfShowAll').addEventListener('click', ()=>{ toggleShowAll(); });
    }
    if(id==='settings'){
      const el = document.getElementById('view-settings'); const first = el.querySelector('.card');
      const holder = document.createElement('div');
      holder.innerHTML = `<div class="card" style="max-width:560px;margin-top:16px;"><h4>Modules</h4><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:8px;"><p style="font-size:13px;">Show every module regardless of age (${esc(BAND_INFO[state.v7.band].label)})</p><button class="btn btn-outline btn-sm" id="stShowAll">${state.v7.showAll?'On — turn off':'Off — turn on'}</button></div></div>`;
      if(first && first.parentNode) first.parentNode.insertBefore(holder.firstElementChild, first.nextSibling);
      document.getElementById('stShowAll').addEventListener('click', ()=>toggleShowAll());
    }
    if(id==='parentzone' && document.getElementById('parentZonePrintArea')){
      insertAfterHead('parentzone', v7ParentDashboardHTML());
    }
  }catch(e){ console.error('v7DecorateExtra', id, e); }
}

/* ---- re-apply the adaptive strips / extra panels whenever an existing view re-renders itself ---- */
(function(){
  const wrapDeco = (name, fn, deco)=>{ return function(){ const r = fn.apply(this, arguments); try{ deco(); }catch(e){ console.error('decorate '+name, e); } return r; }; };
  renderProfile = wrapDeco('profile', renderProfile, ()=>v7DecorateExtra('profile'));
  renderSettings = wrapDeco('settings', renderSettings, ()=>v7DecorateExtra('settings'));
  renderProgress = wrapDeco('progress', renderProgress, ()=>v7DecorateExtra('progress'));
  renderPractice = wrapDeco('practice', renderPractice, ()=>v7DecorateExtra('practice'));
  renderParentZoneContent = wrapDeco('parentzone', renderParentZoneContent, ()=>v7DecorateExtra('parentzone'));
  renderLessons = wrapDeco('lessons', renderLessons, ()=>v7DecorateView('lessons'));
  renderMathematics = wrapDeco('mathematics', renderMathematics, ()=>v7DecorateView('mathematics'));
  renderVedicMaths = wrapDeco('vedicmaths', renderVedicMaths, ()=>v7DecorateView('vedicmaths'));
  renderVocabulary = wrapDeco('vocabulary', renderVocabulary, ()=>v7DecorateView('vocabulary'));
  renderGrammar = wrapDeco('grammar', renderGrammar, ()=>v7DecorateView('grammar'));
  renderStories = wrapDeco('stories', renderStories, ()=>v7DecorateView('stories'));
})();

/* ===== end v7 modules ===== */

function init(){
  ensureV7(); v7AddCertificates(); applyBandToBody();
  applyTheme();
  buildNav();
  updateProfileChip();
  const brandSmall = document.querySelector('.brand-row .brand small');
  if(brandSmall) brandSmall.textContent = `Speak with confidence · v${APP_VERSION}`;
  const mobileVersionPill = document.getElementById('mobileVersionPill');
  if(mobileVersionPill) mobileVersionPill.textContent = 'v'+APP_VERSION;
  document.getElementById('topThemeBtn').addEventListener('click', toggleTheme);
  document.getElementById('sideThemeBtn').addEventListener('click', toggleTheme);
  document.getElementById('onboardModal').addEventListener('click', e=>{ /* prevent close-on-outside for mandatory first-run form */ });

  if(!state.onboarded){
    openOnboarding();
    navigateTo('home');
  } else {
    navigateTo('home');
  }
}
document.addEventListener('DOMContentLoaded', init);
</script>
