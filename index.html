<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>EduQuest — Learn. Practise. Achieve.</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap');

/* ===================== DESIGN TOKENS ===================== */
:root{
  --blue:#3B5BFE;
  --blue-deep:#2440D6;
  --purple:#8B5CF6;
  --purple-deep:#6D28D9;
  --grad: linear-gradient(135deg,var(--blue) 0%,var(--purple) 100%);
  --bg:#F3F5FF;
  --surface:#FFFFFF;
  --surface-2:#F7F8FF;
  --border:#E3E6FA;
  --text:#1C2140;
  --muted:#6B7195;
  --success:#1FAE6B;
  --success-bg:#E7F9F1;
  --warn:#F5A623;
  --warn-bg:#FFF6E5;
  --danger:#EF4444;
  --danger-bg:#FDEAEA;
  --shadow: 0 8px 24px -8px rgba(59,91,254,0.18);
  --shadow-sm: 0 2px 8px rgba(28,33,64,0.06);
  --radius:18px;
  --radius-sm:12px;
  --font-head:'Baloo 2', 'Inter', sans-serif;
  --font-body:'Inter', sans-serif;
}
[data-theme="dark"]{
  --bg:#0F1130;
  --surface:#191C3E;
  --surface-2:#20244D;
  --border:#2B2F5C;
  --text:#EAECFB;
  --muted:#9498C4;
  --success-bg:#123528;
  --warn-bg:#3A2E10;
  --danger-bg:#3A1818;
  --shadow: 0 8px 28px -8px rgba(0,0,0,0.5);
  --shadow-sm: 0 2px 10px rgba(0,0,0,0.35);
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--font-body);
  -webkit-font-smoothing:antialiased;
  transition:background .3s ease,color .3s ease;
  padding-bottom:76px;
}
h1,h2,h3,h4,.brand,.nav-label,.big-num{font-family:var(--font-head);}
h1,h2,h3,h4{margin:0 0 4px 0;font-weight:700;letter-spacing:-0.01em;}
p{margin:0;color:var(--muted);line-height:1.55;}
button{font-family:var(--font-body);cursor:pointer;}
a{color:inherit;text-decoration:none;}
::selection{background:var(--purple);color:#fff;}
:focus-visible{outline:3px solid var(--purple);outline-offset:2px;}
@media (prefers-reduced-motion: reduce){*{animation-duration:0.001ms !important;transition-duration:0.001ms !important;}}

.hidden{display:none !important;}
.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);}

/* ===================== LAYOUT SHELL ===================== */
.app-shell{display:flex;min-height:100vh;}

.sidebar{
  width:240px;flex-shrink:0;background:var(--surface);
  border-right:1px solid var(--border);
  padding:22px 16px;display:none;flex-direction:column;gap:4px;
  position:sticky;top:0;height:100vh;
}
.brand-row{display:flex;align-items:center;gap:10px;padding:6px 10px 22px 10px;}
.brand-mark{width:38px;height:38px;border-radius:12px;background:var(--grad);display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0;}
.brand{font-size:19px;font-weight:800;color:var(--text);}
.brand small{display:block;font-family:var(--font-body);font-weight:500;font-size:11px;color:var(--muted);letter-spacing:.02em;}

.side-link{
  display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;
  color:var(--muted);font-weight:600;font-size:14.5px;border:none;background:transparent;width:100%;text-align:left;
}
.side-link .ic{font-size:18px;width:22px;text-align:center;}
.side-link:hover{background:var(--surface-2);color:var(--text);}
.side-link.active{background:var(--grad);color:#fff;box-shadow:var(--shadow);}

.main-col{flex:1;min-width:0;display:flex;flex-direction:column;}

.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 18px;position:sticky;top:0;z-index:20;
  background:var(--bg);backdrop-filter:blur(6px);
}
.topbar-mobile-brand{display:flex;align-items:center;gap:8px;}
.topbar-mobile-brand .brand-mark{width:30px;height:30px;font-size:15px;border-radius:9px;}
.topbar-mobile-brand .brand{font-size:16px;}
.topbar-actions{display:flex;align-items:center;gap:8px;}

.icon-btn{
  width:40px;height:40px;border-radius:12px;border:1px solid var(--border);
  background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:17px;color:var(--text);
}
.icon-btn:hover{background:var(--surface-2);}

.profile-chip{display:flex;align-items:center;gap:8px;padding:5px 12px 5px 5px;border-radius:999px;background:var(--surface);border:1px solid var(--border);}
.profile-chip .avatar{width:30px;height:30px;border-radius:50%;background:var(--grad);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:13px;}
.profile-chip span{font-size:13.5px;font-weight:600;}

main{padding:4px 16px 24px 16px;max-width:1180px;width:100%;margin:0 auto;}
.section-view{display:none;animation:fadein .35s ease;}
.section-view.active{display:block;}
@keyframes fadein{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

.page-head{margin:6px 2px 18px 2px;}
.page-head p{margin-top:2px;font-size:14.5px;}

/* Bottom nav (mobile) */
.bottom-nav{
  position:fixed;bottom:0;left:0;right:0;z-index:30;
  background:var(--surface);border-top:1px solid var(--border);
  display:flex;justify-content:space-around;padding:6px 2px 8px 2px;
  box-shadow:0 -4px 18px rgba(28,33,64,0.08);
}
.bn-item{display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:none;color:var(--muted);font-size:10.5px;font-weight:600;padding:5px 4px;border-radius:10px;flex:1;max-width:64px;}
.bn-item .ic{font-size:19px;}
.bn-item.active{color:var(--blue);}
.bn-more{position:relative;}

@media(min-width:900px){
  .sidebar{display:flex;}
  .bottom-nav{display:none;}
  body{padding-bottom:0;}
  main{padding:8px 28px 40px 28px;}
  .topbar-mobile-brand{display:none;}
}
@media(max-width:899px){
  .topbar-desktop-actions .search-box{display:none;}
}

/* ===================== CARDS / GRID ===================== */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow-sm);}
.grid{display:grid;gap:14px;}
.grid-2{grid-template-columns:repeat(auto-fit,minmax(230px,1fr));}
.grid-3{grid-template-columns:repeat(auto-fit,minmax(190px,1fr));}
.grid-4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr));}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:11px 18px;border-radius:12px;border:none;font-weight:700;font-size:14px;
}
.btn-primary{background:var(--grad);color:#fff;box-shadow:var(--shadow);}
.btn-primary:active{transform:scale(.98);}
.btn-outline{background:var(--surface);border:1.5px solid var(--border);color:var(--text);}
.btn-outline:hover{border-color:var(--blue);color:var(--blue);}
.btn-soft{background:var(--surface-2);color:var(--text);border:none;}
.btn-sm{padding:7px 13px;font-size:12.5px;border-radius:10px;}
.btn-danger-soft{background:var(--danger-bg);color:var(--danger);border:none;}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.btn-icon-only{width:42px;height:42px;padding:0;border-radius:50%;}

.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 11px;border-radius:999px;font-size:11.5px;font-weight:700;background:var(--surface-2);color:var(--muted);}
.pill-blue{background:#E9EDFF;color:var(--blue-deep);}
[data-theme="dark"] .pill-blue{background:#232A66;color:#AFC0FF;}
.pill-purple{background:#F1E9FE;color:var(--purple-deep);}
[data-theme="dark"] .pill-purple{background:#332259;color:#D3BBFF;}
.pill-success{background:var(--success-bg);color:var(--success);}
.pill-warn{background:var(--warn-bg);color:var(--warn);}

.progress-track{height:9px;background:var(--surface-2);border-radius:999px;overflow:hidden;}
.progress-fill{height:100%;background:var(--grad);border-radius:999px;transition:width .5s ease;}

.modal-overlay{
  position:fixed;inset:0;background:rgba(15,17,48,0.55);backdrop-filter:blur(3px);
  display:flex;align-items:center;justify-content:center;z-index:100;padding:16px;
}
.modal{background:var(--surface);border-radius:22px;max-width:480px;width:100%;max-height:88vh;overflow-y:auto;box-shadow:0 30px 60px -15px rgba(0,0,0,0.3);}
.modal-wide{max-width:640px;}
.modal-pad{padding:26px;}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;}

input[type=text],input[type=number],select,textarea{
  width:100%;padding:11px 13px;border-radius:11px;border:1.5px solid var(--border);
  background:var(--surface-2);color:var(--text);font-family:var(--font-body);font-size:14px;
}
textarea{resize:vertical;}
label.field-label{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin:14px 0 6px 0;}
.chip-select{display:flex;flex-wrap:wrap;gap:8px;}
.chip-opt{padding:8px 14px;border-radius:11px;border:1.5px solid var(--border);background:var(--surface-2);font-size:13px;font-weight:600;color:var(--text);}
.chip-opt.selected{background:var(--grad);border-color:transparent;color:#fff;}

.empty-state{text-align:center;padding:40px 16px;color:var(--muted);}
.empty-state .ic{font-size:38px;display:block;margin-bottom:10px;}

@media print{
  body *{visibility:hidden;}
  #certificatePrintArea, #certificatePrintArea *, #parentZonePrintArea, #parentZonePrintArea *{visibility:visible;}
  #certificatePrintArea{position:fixed;top:0;left:0;width:100%;margin:0;border-radius:0;}
  #parentZonePrintArea{position:absolute;top:0;left:0;width:100%;padding:20px;background:#fff;color:#000;}
  #parentZonePrintArea *{color:#000 !important;background:transparent !important;border-color:#999 !important;box-shadow:none !important;}
}

/* ===================== v7 FAMILY PLATFORM ADDITIONS ===================== */
.side-group{font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:12px 12px 4px 12px;opacity:.8;}
.sidebar{overflow-y:auto;}
.sidebar::-webkit-scrollbar{width:6px;}
.sidebar::-webkit-scrollbar-thumb{background:var(--border);border-radius:6px;}
.side-today{background:var(--grad);color:#fff !important;box-shadow:var(--shadow);margin-bottom:6px;}
.side-today:hover{background:var(--grad) !important;color:#fff !important;filter:brightness(1.06);}

.hero-cta{
  display:flex;align-items:center;justify-content:center;gap:10px;width:100%;
  background:#fff;color:var(--blue-deep);border:none;border-radius:16px;
  padding:16px 18px;font-family:var(--font-head);font-weight:800;font-size:19px;letter-spacing:.01em;
  box-shadow:0 10px 24px -10px rgba(0,0,0,.35);
}
.hero-cta:hover{transform:translateY(-1px);}
.hero-cta small{display:block;font-family:var(--font-body);font-size:12px;font-weight:600;color:var(--muted);letter-spacing:0;}
.hero-cta .ic{font-size:26px;}
.xp-track{height:10px;background:rgba(255,255,255,.28);border-radius:999px;overflow:hidden;}
.xp-fill{height:100%;background:#FFD66B;border-radius:999px;transition:width .5s ease;}
.xp-track.on-surface{background:var(--surface-2);}
.xp-track.on-surface .xp-fill{background:linear-gradient(90deg,#F5A623,#FF7A59);}

.home-grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));margin-bottom:16px;}
.mini-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--border);}
.mini-row:last-child{border-bottom:none;}
.sub-pill{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700;background:var(--surface-2);color:var(--muted);}
.lvl-easy{background:var(--success-bg);color:var(--success);}
.lvl-med{background:var(--warn-bg);color:var(--warn);}
.lvl-hard{background:var(--danger-bg);color:var(--danger);}
.star-row{letter-spacing:2px;}

/* quiz runner */
.q-visual{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:6px;margin:12px 0 4px 0;font-size:40px;line-height:1.15;text-align:center;}
.q-visual svg{max-width:100%;height:auto;}
.q-text{font-size:17px;font-weight:700;color:var(--text);margin:10px 0 4px 0;line-height:1.45;white-space:pre-line;}
.q-opts{display:grid;gap:10px;margin-top:12px;}
.q-opts.cols2{grid-template-columns:1fr 1fr;}
.q-opt{
  display:flex;align-items:center;justify-content:flex-start;gap:8px;text-align:left;
  padding:13px 15px;border-radius:14px;border:2px solid var(--border);background:var(--surface);
  color:var(--text);font-size:15px;font-weight:600;min-height:52px;
}
.q-opt:hover:not(:disabled){border-color:var(--blue);background:var(--surface-2);}
.q-opt.big{justify-content:center;font-size:34px;min-height:84px;text-align:center;}
.q-opt.right{border-color:var(--success);background:var(--success-bg);color:var(--success);}
.q-opt.wrong{border-color:var(--danger);background:var(--danger-bg);color:var(--danger);}
.q-opt:disabled{cursor:default;}
.q-feedback{margin-top:12px;padding:12px 14px;border-radius:12px;font-size:13.5px;line-height:1.5;}
.q-feedback.ok{background:var(--success-bg);color:var(--text);border:1px solid var(--success);}
.q-feedback.bad{background:var(--danger-bg);color:var(--text);border:1px solid var(--danger);}
.q-feedback b.t{display:block;margin-bottom:2px;}
.memory-box{background:var(--surface-2);border:2px dashed var(--purple);border-radius:16px;padding:14px;text-align:center;font-size:34px;margin:10px 0;}
.sms-bubble{background:var(--surface-2);border:1px solid var(--border);border-radius:14px 14px 14px 4px;padding:10px 13px;font-size:14px;color:var(--text);text-align:left;max-width:520px;margin:6px auto;line-height:1.45;font-weight:500;}

/* generic topic tiles */
.topic-tile{text-align:left;border:1.5px solid var(--border);background:var(--surface);border-radius:16px;padding:14px;color:var(--text);box-shadow:var(--shadow-sm);display:flex;flex-direction:column;gap:6px;}
.topic-tile:hover{border-color:var(--blue);}
.topic-tile .ti{font-size:28px;}
.topic-tile h4{font-size:15px;margin:0;}
.topic-tile p{font-size:12px;}
.topic-tile.locked{opacity:.55;}
.mastery-dots{display:flex;gap:4px;}
.mastery-dots i{width:18px;height:6px;border-radius:4px;background:var(--surface-2);display:block;}
.mastery-dots i.on{background:var(--success);}

/* big kid cards */
.kid-grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));}
.kid-card{
  background:var(--surface);border:2.5px solid var(--border);border-radius:22px;padding:14px 8px;text-align:center;
  color:var(--text);font-weight:800;font-family:var(--font-head);font-size:19px;box-shadow:var(--shadow-sm);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:128px;
}
.kid-card .em{font-size:50px;line-height:1.1;}
.kid-card small{font-family:var(--font-body);font-size:12.5px;font-weight:600;color:var(--muted);}
.kid-card:active{transform:scale(.96);}
.kid-card.sel{border-color:var(--purple);background:var(--surface-2);}
.kid-card.done{border-color:var(--success);background:var(--success-bg);}
.kid-card.miss{border-color:var(--danger);}
.swatch{width:64px;height:64px;border-radius:50%;border:3px solid rgba(0,0,0,.12);}
.tile-letter{width:56px;height:56px;border-radius:14px;border:2.5px solid var(--border);background:var(--surface);font-size:28px;font-weight:800;color:var(--text);font-family:var(--font-head);}
.tile-slot{width:56px;height:56px;border-radius:14px;border:2.5px dashed var(--border);display:inline-flex;align-items:center;justify-content:center;font-size:28px;font-weight:800;color:var(--text);font-family:var(--font-head);}
.tile-slot.filled{border-style:solid;border-color:var(--blue);}
.mem-card{height:84px;font-size:38px;border-radius:16px;border:2.5px solid var(--border);background:var(--grad);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;}
.mem-card.up{background:var(--surface);color:var(--text);}
.mem-card.matched{background:var(--success-bg);border-color:var(--success);}
.kid-tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;}
.kid-tabs .chip-opt{font-size:14px;padding:10px 14px;min-height:44px;}
.group-label{font-size:11.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:12px 2px 6px 2px;}

body[data-band="2-4"] .q-text,body[data-band="4-6"] .q-text{font-size:21px;}
body[data-band="2-4"] .q-opt,body[data-band="4-6"] .q-opt{font-size:19px;min-height:62px;}
body[data-band="2-4"] .btn,body[data-band="4-6"] .btn{font-size:16px;padding:14px 20px;}
body[data-band="2-4"] p,body[data-band="4-6"] p{font-size:15px;}

/* speaking */
.step-row{display:flex;gap:8px;justify-content:center;margin:10px 0;flex-wrap:wrap;}
.step-chip{padding:6px 12px;border-radius:999px;font-size:12px;font-weight:800;background:var(--surface-2);color:var(--muted);border:1.5px solid var(--border);}
.step-chip.on{background:var(--grad);color:#fff;border-color:transparent;}
.step-chip.done{background:var(--success-bg);color:var(--success);border-color:var(--success);}
.w-ok{background:var(--success-bg);color:var(--success);border-radius:8px;padding:2px 7px;margin:2px;display:inline-block;font-weight:700;font-size:13px;}
.w-miss{background:var(--danger-bg);color:var(--danger);border-radius:8px;padding:2px 7px;margin:2px;display:inline-block;font-weight:700;font-size:13px;}
.rec-dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--danger);animation:pulse 1s infinite;}
@keyframes pulse{50%{opacity:.25;}}
.big-timer{font-family:var(--font-head);font-size:40px;font-weight:800;color:var(--text);text-align:center;}

/* worksheets / toolkit */
.ws-sheet{background:#fff;color:#000;border:1px solid var(--border);border-radius:12px;padding:22px;font-family:Georgia,'Times New Roman',serif;}
.ws-sheet h2,.ws-sheet h3{color:#000;font-family:Georgia,serif;}
.ws-sheet p{color:#222;}
.ws-q{margin:14px 0;font-size:15px;line-height:1.5;color:#000;page-break-inside:avoid;}
.ws-q .opts{display:grid;grid-template-columns:1fr 1fr;gap:4px 18px;margin:6px 0 0 18px;font-size:14px;}
.ws-line{border-bottom:1px solid #444;height:22px;margin:6px 0 0 18px;}
.ws-head{display:flex;justify-content:space-between;border-bottom:2px solid #000;padding-bottom:6px;margin-bottom:10px;font-size:13px;color:#000;gap:8px;flex-wrap:wrap;}
.ws-visual{font-size:26px;margin:4px 0 4px 18px;}
#printHost{display:none;}

.calc-grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));}
.calc-out{margin-top:12px;padding:12px 14px;border-radius:12px;background:var(--surface-2);border:1px dashed var(--purple);font-size:14px;color:var(--text);line-height:1.6;}
.bar-chart{display:flex;gap:6px;align-items:flex-end;height:80px;margin-top:8px;}
.bar-chart .b{flex:1;text-align:center;font-size:10px;color:var(--muted);}
.bar-chart .b i{display:block;border-radius:6px 6px 0 0;background:var(--grad);min-height:3px;margin-bottom:3px;}
.flag-box{border:1px solid var(--border);border-radius:6px;overflow:hidden;display:inline-block;line-height:0;box-shadow:var(--shadow-sm);}
.planet{display:inline-block;border-radius:50%;}
.range-wrap{display:flex;align-items:center;gap:10px;}
.range-wrap input[type=range]{flex:1;}
.dismiss-note{background:var(--warn-bg);border:1px solid var(--warn);border-radius:14px;padding:12px 14px;margin-bottom:14px;font-size:13px;color:var(--text);display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap;}

@media print{
  body.v7-printing .app-shell,body.v7-printing .bottom-nav,body.v7-printing .modal-overlay,body.v7-printing #toastHost{display:none !important;}
  body.v7-printing #printHost{display:block !important;position:static;width:100%;padding:0;background:#fff;color:#000;}
  body.v7-printing #printHost, body.v7-printing #printHost *{visibility:visible !important;}
  body.v7-printing{background:#fff !important;padding:0 !important;}
  .ws-sheet{border:none;padding:0;}
  .ws-break{page-break-before:always;}
}

#toastHost{pointer-events:none;}
#toastHost > div{pointer-events:none;}

</style>
</head>
<body data-theme="light">

<!-- ========================= APP SHELL ========================= -->
<div class="app-shell">

  <!-- Sidebar (desktop) -->
  <nav class="sidebar" aria-label="Main navigation">
    <div class="brand-row">
      <div class="brand-mark">🗣️</div>
      <div class="brand">EduQuest<small>Learn. Practise. Achieve.</small></div>
    </div>

function toast(msg, type){
  const host = document.getElementById('toastHost');
  const el = document.createElement('div');
  el.style.cssText = 'background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow);padding:11px 18px;border-radius:12px;font-size:13.5px;font-weight:600;color:var(--text);max-width:88vw;';
  if(type==='success'){ el.style.borderColor='var(--success)'; el.textContent = '✓ '+msg; }
  else if(type==='error'){ el.style.borderColor='var(--danger)'; el.textContent = '✕ '+msg; }
  else { el.textContent = msg; }
  host.appendChild(el);
  setTimeout(()=>{ el.style.transition='opacity .4s'; el.style.opacity='0'; setTimeout(()=>el.remove(),400); }, 2400);
}

function esc(str){
  const d = document.createElement('div'); d.textContent = str==null?'':String(str); return d.innerHTML;

/* Predefined fallback conversation trees per teacher (clearly-labelled sample dialogue,
   not a live AI). Each entry: user-facing prompt -> teacher reply + gentle correction tip. */
function fallbackTeacherReply(teacherId, level, userText){
  const t = TEACHERS.find(x=>x.id===teacherId);
  const text = (userText||'').trim();
  if(!text){ return "I didn't catch that — could you try saying a full sentence?"; }
  const lower = text.toLowerCase();
  const bank = [
    { match:/^(hi|hello|hey)/, reply:"Hello! Nice to meet you. Can you introduce yourself in one full sentence — for example, \"My name is ___ and I am from ___.\"" },
    { match:/my name is|i am from|i'm from/, reply:"Good sentence! Small tip: say \"I am from ___\" or \"I'm from ___\" — both are correct in spoken English. Now tell me, what do you do every day?" },
    { match:/i (like|love|enjoy)/, reply:"Great, that's a natural way to talk about preferences. Try adding a reason: \"I like ___ because ___.\" Can you try that?" },
    { match:/because/, reply:"Well explained! Using 'because' to give reasons makes your English sound much more fluent. Let's try another topic — describe your typical morning." },
    { match:/i (goes|go|going)/, reply:"Almost! For present habits we say \"I go\" (not \"I goes\"). \"Goes\" is only for he/she/it. Try the sentence again with \"I go\"." },
    { match:/yesterday|last (week|night|year)/, reply:"Good, you're using the past tense context. Make sure the verb matches — for example \"I went\" instead of \"I go\" when talking about yesterday." },
    { match:/.*/, reply:"That's a good attempt. Try to build a complete sentence with a subject and a verb — for example: \"I ___ every day.\" Want to try again?" }
  ];
  const hit = bank.find(b=>b.match.test(lower));
  let reply = hit ? hit.reply : bank[bank.length-1].reply;
  if(level==='Beginner') reply = reply.replace(/Well explained!|Great, that's/,'Good job!');
  return reply;
}

  side.innerHTML = NAV_ITEMS.filter(n=>n.id!=='settings').map(n=>
    `<button class="side-link" data-nav="${n.id}"><span class="ic">${n.icon}</span><span>${n.label}</span></button>`
  ).join('');

  // Bottom nav: 4 primary + "More" opening a quick menu via settings-like sheet.
  const primary = ['home','lessons','speak','practice'];
  const bn = document.getElementById('bottomNav');
  bn.innerHTML = primary.map(id=>{
    const n = NAV_ITEMS.find(x=>x.id===id);
    return `<button class="bn-item" data-nav="${id}"><span class="ic">${n.icon}</span>${n.label}</button>`;
  }).join('') + `<button class="bn-item bn-more" id="bnMoreBtn"><span class="ic">☰</span>More</button>`;

  document.querySelectorAll('[data-nav]').forEach(btn=>{
    btn.addEventListener('click', ()=> navigateTo(btn.getAttribute('data-nav')));
  });
  document.getElementById('bnMoreBtn').addEventListener('click', openMoreSheet);
}

function openMoreSheet(){
  const rest = NAV_ITEMS.filter(n=>!['home','lessons','speak','practice'].includes(n.id));
  showGenericModal(`
    <div class="modal-head"><h3>More</h3><button class="icon-btn" onclick="closeGenericModal()">✕</button></div>
    <div style="display:flex;flex-direction:column;gap:6px;margin-top:10px;">
      ${rest.map(n=>`<button class="side-link" style="background:var(--surface-2);" data-nav="${n.id}" onclick="closeGenericModal();navigateTo('${n.id}')"><span class="ic">${n.icon}</span><span>${n.label}</span></button>`).join('')}
    </div>
  `);
}

function navigateTo(viewId){
  currentView = viewId;
  document.querySelectorAll('.section-view').forEach(v=>v.classList.remove('active'));
  document.getElementById('view-'+viewId).classList.add('active');
  document.querySelectorAll('.side-link[data-nav]').forEach(b=>b.classList.toggle('active', b.getAttribute('data-nav')===viewId));
  document.querySelectorAll('.bn-item[data-nav]').forEach(b=>b.classList.toggle('active', b.getAttribute('data-nav')===viewId));
  renderView(viewId);
  window.scrollTo({top:0, behavior:'smooth'});
}

/* ====================================================================
   SPEECH: SYNTHESIS (Teacher voice preview / audio playback)
==================================================================== */
let voicesCache = [];
function loadVoices(){ voicesCache = speechSynthesis.getVoices ? speechSynthesis.getVoices() : []; }
if('speechSynthesis' in window){
  loadVoices();
  speechSynthesis.onvoiceschanged = ()=>{
    loadVoices();
    // Voice list loads asynchronously in many browsers — refresh the availability
    // warning if the user is already looking at the Languages section.
    if(currentView==='languages') renderLanguages();
  };
}
/* Common TTS voice names are not reliably tagged with gender by the Web Speech API,
   so we match on well-known voice names shipped by major browsers/OSes as a heuristic.
   For "baby" we first look for an actual child-labelled voice (rare, but some
   platforms ship one); if none exists, we fall back to a female-leaning voice and
   rely on the pitch/rate shift in speak() to create the childlike effect. */
const FEMALE_VOICE_HINTS = ['female','woman','zira','samantha','karen','susan','victoria','moira','tessa','fiona','veena','lekha','heera','kalpana','amelie','anna','helena','katja','paulina','ava','allison','ioana'];
const MALE_VOICE_HINTS = ['male','man','david','daniel','mark','alex','fred','aaron','ravi','hemant','rishi','thomas','yannick','stefan','diego','jorge','xander'];
const KID_VOICE_HINTS = ['child','kid','junior','young','boy','girl'];
/* Many devices ship several voices per language of very different quality — a robotic
   legacy "compact" voice alongside a much better one. These hints catch the better ones
   so free playback sounds as natural as the device allows, before any gender matching. */
const QUALITY_VOICE_HINTS = ['natural','neural','online','premium','enhanced','wavenet','studio','plus','siri'];
function voiceQualityScore(voiceName){
  const n = (voiceName||'').toLowerCase();
  if(QUALITY_VOICE_HINTS.some(h=>n.includes(h))) return 2;
  if(n.includes('google')) return 1;
  if(n.includes('compact') || n.includes('espeak')) return -2;
  return 0;
}
function voiceGenderScore(voiceName, wantGender){
  const n = (voiceName||'').toLowerCase();
  if(wantGender==='baby' && KID_VOICE_HINTS.some(h=>n.includes(h))) return 3;
  const wantsFemaleLike = wantGender!=='male';
  const hints = wantsFemaleLike ? FEMALE_VOICE_HINTS : MALE_VOICE_HINTS;
  const oppositeHints = wantsFemaleLike ? MALE_VOICE_HINTS : FEMALE_VOICE_HINTS;
  if(hints.some(h=>n.includes(h))) return 2;
  if(oppositeHints.some(h=>n.includes(h))) return -2;
  return 0;
}
function pickVoice(langCode, gender){
  if(!voicesCache || !voicesCache.length) loadVoices();
  if(!voicesCache.length) return null;
  const lang = (langCode||'en-US').toLowerCase();
  const base = lang.split('-')[0];
  // Build a candidate pool: exact lang match first, then same base language, then English, then anything.
  let pool = voicesCache.filter(v=>v.lang && v.lang.toLowerCase()===lang);
  if(!pool.length) pool = voicesCache.filter(v=>v.lang && v.lang.toLowerCase().startsWith(base));
  if(!pool.length) pool = voicesCache.filter(v=>v.lang && v.lang.toLowerCase().startsWith('en'));
  if(!pool.length) pool = voicesCache;
  if(pool.length > 1){
    // Quality dominates (×10) so the best-sounding voice wins; gender preference
    // breaks ties among voices of similar quality.
    const scored = pool.map(v=>({v, score: voiceQualityScore(v.name)*10 + voiceGenderScore(v.name, gender||'female')}));
    scored.sort((a,b)=>b.score-a.score);
    if(scored[0].score > scored[scored.length-1].score) return scored[0].v;
  }
  return pool[0] || voicesCache[0] || null;
}
/* Pitch/rate shift applied on top of whatever voice is found — this is what actually makes
   male / female / baby sound distinct and consistent, since many devices only have one
   voice per language anyway. Values are pushed close to the Web Speech API's 0–2 pitch
   ceiling for baby so the effect is clearly audible; how much a given browser/voice engine
   actually honours pitch shifting is outside what this API can control. */
function pitchForVoiceGender(g){
  if(g==='male') return 0.78;
  if(g==='baby') return 1.9;
  return 1.05; // female (default)
}
/* Whether any installed voice actually matches the requested language's base code
   (e.g. 'pa' for 'pa-IN') — used to warn the user instead of silently substituting
   a different language's voice, which the Web Speech API does with no signal of its own. */
function hasVoiceFor(langCode){
  if(!voicesCache || !voicesCache.length) loadVoices();
  const base = (langCode||'').toLowerCase().split('-')[0];
  return voicesCache.some(v=>v.lang && v.lang.toLowerCase().startsWith(base));
}

/* ---- Optional natural AI voice (OpenAI TTS) — the free path above is a real built-in
   browser voice and will always sound somewhat synthetic; this is the only way to get
   genuinely natural speech, and it requires the user's own API key and an internet
   connection (unlike the rest of this offline-first app). Off by default. ---- */
const OPENAI_VOICE_MAP = { male:'onyx', female:'nova', baby:'shimmer' };
let premiumAudioEl = null;
function speak(text, langCode, onend, genderOverride){
  const gender = genderOverride || state.voiceGender || 'female';
  if(state.premiumVoiceKey){
    speakPremium(text, langCode, gender, onend);
    return true;
  }
  return speakBrowser(text, langCode, onend, gender);
}
function speakBrowser(text, langCode, onend, gender){
  if(!('speechSynthesis' in window)){
    toast('Speech playback is not supported in this browser.','error');
    if(onend) onend();
    return false;
  }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  const v = pickVoice(langCode||'en-US', gender);
  if(v) u.voice = v;
  // Use the ACTUAL selected voice's language, not just the requested one — if no voice
  // exists for the requested language, v falls back (e.g. to English) and setting u.lang
  // to that fallback's real language keeps voice/lang consistent and avoids odd behaviour
  // in browsers that second-guess a mismatched voice/lang pair.
  u.lang = (v && v.lang) ? v.lang : (langCode || 'en-US');
  u.rate = (state.speakRate || 0.95) * (gender==='baby' ? 1.15 : 1);
  u.pitch = pitchForVoiceGender(gender);
  if(onend) u.onend = onend;
  u.onerror = ()=>{ toast('Voice for this language may not be installed on your device.','error'); if(onend) onend(); };
  speechSynthesis.speak(u);
  return true;
}
function speakPremium(text, langCode, gender, onend){
  const voiceName = OPENAI_VOICE_MAP[gender] || 'nova';
  if(premiumAudioEl){ try{ premiumAudioEl.pause(); }catch(e){} }
  fetch('https://api.openai.com/v1/audio/speech', {
    method:'POST',
    headers:{ 'Authorization':'Bearer '+state.premiumVoiceKey, 'Content-Type':'application/json' },
    body: JSON.stringify({ model:'tts-1', voice:voiceName, input:text })
  }).then(resp=>{
    if(!resp.ok) throw new Error('HTTP '+resp.status);
    return resp.blob();
  }).then(blob=>{
    const url = URL.createObjectURL(blob);
    premiumAudioEl = new Audio(url);
    premiumAudioEl.onended = ()=>{ URL.revokeObjectURL(url); if(onend) onend(); };
    premiumAudioEl.onerror = ()=>{ URL.revokeObjectURL(url); if(onend) onend(); };
    premiumAudioEl.play().catch(()=>{ speakBrowser(text, langCode, onend, gender); });
  }).catch(()=>{
    toast('Natural voice unavailable right now — using the built-in voice instead.','error');
    speakBrowser(text, langCode, onend, gender);
  });
}
function stopSpeak(){
  if('speechSynthesis' in window) speechSynthesis.cancel();
  if(premiumAudioEl){ try{ premiumAudioEl.pause(); }catch(e){} }
}

/* For playing ENGLISH model sentences with any teacher persona: use the teacher's own
   voice if it's an English variant, otherwise fall back to their chosen accent so the
   sentence stays intelligible as English rather than being read in another language. */
function englishVoiceFor(teacher){
  if(teacher.voiceLang && teacher.voiceLang.toLowerCase().startsWith('en')) return teacher.voiceLang;
  return state.profile.accent === 'British English' ? 'en-GB' : 'en-US';
}

/* ====================================================================
   WELCOME MUSIC — a short, gentle, procedurally generated melody played
   on the onboarding screen. Synthesised in-browser with the Web Audio
   API (original tones only, never a real recording), so there are no
   copyright concerns. Requires a user tap to start, per browser
   autoplay rules.
==================================================================== */
let musicCtx = null, musicTimer = null, musicPlaying = false;
const MUSIC_SCALE = [523.25, 587.33, 659.25, 783.99, 880.00, 987.77, 1046.50]; // C5 D5 E5 G5 A5 B5 C6 (pentatonic-friendly)
const MUSIC_PATTERN = [0,2,4,2,1,3,4,2,0,4,5,4,2,1,0,0];
function playMusicNote(freq, startTime, duration){
  const osc = musicCtx.createOscillator();
  const gain = musicCtx.createGain();
  osc.type = 'sine';
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(0.0001, startTime);
  gain.gain.linearRampToValueAtTime(0.05, startTime + 0.06);
  gain.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);
  osc.connect(gain).connect(musicCtx.destination);
  osc.start(startTime);
  osc.stop(startTime + duration + 0.05);
}
function scheduleMusicLoop(){
  if(!musicPlaying || !musicCtx) return;
  const now = musicCtx.currentTime + 0.05;
  let t = now;
  MUSIC_PATTERN.forEach(i=>{
    playMusicNote(MUSIC_SCALE[i], t, 0.55);
    t += 0.42;
  });
  musicTimer = setTimeout(scheduleMusicLoop, MUSIC_PATTERN.length * 420);
}
function toggleWelcomeMusic(){
  const btn = document.getElementById('musicToggleBtn');
  if(musicPlaying){
    musicPlaying = false;
    if(musicTimer) clearTimeout(musicTimer);
    if(btn) btn.textContent = '🎵 Play soft music';
    return;
  }
  if(!musicCtx){
    try{ musicCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    catch(e){ toast('Background music is not supported in this browser.','error'); return; }
  }
  if(musicCtx.state === 'suspended') musicCtx.resume();
  musicPlaying = true;
  if(btn) btn.textContent = '🔇 Stop music';
  scheduleMusicLoop();
}
function stopWelcomeMusic(){
  musicPlaying = false;
  if(musicTimer) clearTimeout(musicTimer);
}

/* ====================================================================
   SPEECH: RECOGNITION (mic input — graceful fallback if unsupported)
==================================================================== */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
function startRecognition(lang, onResult, onEnd){
  if(!SR){
    toast('Speech recognition is not supported in this browser — please type instead.','error');
    if(onEnd) onEnd();
    return null;
  }
  const rec = new SR();
  rec.lang = lang || 'en-US';
  rec.interimResults = false;
  rec.maxAlternatives = 1;
  rec.onresult = (e)=>{ const text = e.results[0][0].transcript; onResult(text); };
  rec.onerror = ()=>{ toast('Could not hear you clearly — please try again or type.','error'); };
  rec.onend = ()=>{ if(onEnd) onEnd(); };
  try{ rec.start(); }catch(e){ toast('Microphone could not be started.','error'); if(onEnd) onEnd(); return null; }
  return rec;
}

==================================================================== */
function todayStr(){ return new Date().toISOString().slice(0,10); }
function markActiveToday(){
  const today = todayStr();
  if(state.progress.lastActiveDate === today) return;
  const y = new Date(); y.setDate(y.getDate()-1);
  const yesterday = y.toISOString().slice(0,10);
  if(state.progress.lastActiveDate === yesterday){ state.progress.streak += 1; }
  else if(state.progress.lastActiveDate !== today){ state.progress.streak = 1; }
  state.progress.lastActiveDate = today;
  if(!state.progress.activeDays.includes(today)) state.progress.activeDays.push(today);
  checkBadges();
  saveState();
}
function addPoints(n){ state.progress.points += n; state.progress.confidenceScore = Math.min(100, state.progress.confidenceScore + Math.round(n/4)); checkBadges(); saveState(); }
function checkBadges(){
  const b = state.progress;
  const earn = (id,label)=>{ if(!state.badges.includes(id)){ state.badges.push(id); toast('New badge earned: '+label,'success'); } };
  if(b.streak>=3) earn('streak3','3-Day Streak 🔥');
  if(b.streak>=7) earn('streak7','7-Day Streak 🏆');
  if(b.lessonsCompleted.length>=3) earn('lessons3','Lesson Explorer 📘');
  if(b.vocabLearned.length>=10) earn('vocab10','Word Collector 🧠');
  if(b.storiesRead.length>=2) earn('stories2','Story Reader 📖');
  if(b.rhymesLearned.length>=5) earn('rhymes5','Rhyme Time 🎵');
  if(b.toddlerWordsLearned.length>=20) earn('words20','First Words Star ⭐');
  const totalLangItems = Object.values(state.langProgress.learnedItems).reduce((sum,arr)=>sum+arr.length, 0);
  if(totalLangItems>=15) earn('lang15','Language Explorer 🌍');
  if(b.numbersLearned.length>=50) earn('numbers50','Number Whiz 🔢');
  if(b.alphabetLearned.length>=26) earn('alphabet26','Alphabet Star 🔠');
  if(b.tablesPracticed.length>=5) earn('tables5','Times Tables Pro ✖️');
  const totalCreatures = ADVENTURE_LOCATIONS.reduce((s,l)=>s+l.creatures.length,0);
  if(b.adventureMap.defeatedCreatures.length>=1) earn('adventure1','First Victory ⚔️');
  if(b.adventureMap.defeatedCreatures.length>=totalCreatures) earn('adventureAll','Realm Champion 🏆');
  if(b.mathLessonsCompleted.length>=6) earn('math6','Maths Whiz ➗');
  if(b.vedicTechniquesLearned.length>=6) earn('vedicAll','Sutra Master 🕉️');
  if(b.vedicBestStreak>=8) earn('vedicStreak8','Mental Maths Champion ⚡');
}

let studySession = null; // { activities, idx, status:'landing'|'running'|'paused'|'done', micEnabled, micStream, audioCtx, rafId, startedAt, pausedMs }

function buildStudyActivities(){
  const vocabPool = VOCABULARY.filter(v=>!state.progress.vocabLearned.includes(v.id));
  const vocabPicks = shuffle([...(vocabPool.length>=3 ? vocabPool : VOCABULARY)]).slice(0,3);
  const topic = shuffle([...SPEAKING_TOPICS])[0];
  const sentencePicks = shuffle([...topic.sentences]).slice(0,3);
  const quizQ = buildDailyQuizQuestions()[0];
  const activities = [];
  vocabPicks.forEach(v => activities.push({type:'vocab', data:v}));
  sentencePicks.forEach(s => activities.push({type:'speak', data:s}));
  activities.push({type:'quiz', data:quizQ});
  return activities;
}

  studySession = { activities: buildStudyActivities(), idx:0, status:'landing', micEnabled:false, micStream:null, audioCtx:null, rafId:null, startedAt:null, pausedMs:0 };

function enableStudyMic(){
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    toast('Microphone access is not supported in this browser.','error'); return;
  }
  navigator.mediaDevices.getUserMedia({audio:true}).then(stream=>{
    studySession.micStream = stream;
    studySession.micEnabled = true;
    toast('Microphone enabled','success');
    if(studySession.status==='landing') renderStudyLanding();
  }).catch(()=>{ toast('Microphone permission denied.','error'); });
}
function startMicMonitor(barEl){
  if(!studySession.micStream || !barEl) return;
  try{
    const audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    const source = audioCtx.createMediaStreamSource(studySession.micStream);
    const analyser = audioCtx.createAnalyser();
    analyser.fftSize = 256;
    source.connect(analyser);
    const data = new Uint8Array(analyser.frequencyBinCount);
    studySession.audioCtx = audioCtx;
    function tick(){
      if(!studySession || studySession.status!=='running') return;
      analyser.getByteFrequencyData(data);
      const avg = data.reduce((a,b)=>a+b,0)/data.length;
      const pct = Math.min(100, Math.round((avg/130)*100));
      if(barEl.isConnected) barEl.style.width = pct+'%';
      studySession.rafId = requestAnimationFrame(tick);
    }
    tick();
  }catch(e){ /* AudioContext unavailable — monitor silently skipped */ }
}
function stopMicMonitor(){
  if(!studySession) return;
  if(studySession.rafId) cancelAnimationFrame(studySession.rafId);
  if(studySession.audioCtx){ try{ studySession.audioCtx.close(); }catch(e){} studySession.audioCtx = null; }
}

function startLangQuiz(langId){
  const content = LANG_CONTENT[langId];
  const pool = [...content.phrases, ...content.vocab];
  const questions = buildLangQuizQuestions(pool, Math.min(8, pool.length));
  let idx = 0, score = 0;
  function next(){
    if(idx >= questions.length){
      state.langProgress.quizScores[langId] = {score, total:questions.length};
      addPoints(score*2);
      checkBadges();
      saveState();
      showGenericModal(`
        <div class="modal-head"><h3>🎯 Quiz Complete</h3><button class="icon-btn" onclick="closeGenericModal();renderLanguageHub('${langId}');">✕</button></div>
        <div style="text-align:center;padding:20px 0;">
          <div style="font-size:38px;">🎉</div>
          <h2 style="margin-top:10px;">${score} / ${questions.length}</h2>
          <p>Great practice! Points added to your progress.</p>
          <button class="btn btn-primary" style="margin-top:14px;" onclick="closeGenericModal();renderLanguageHub('${langId}');">Done</button>
        </div>
      `);
      return;
    }
    const q = questions[idx];
    showGenericModal(`
      <div class="modal-head"><span class="pill pill-blue">Q${idx+1}/${questions.length}</span><button class="icon-btn" onclick="closeGenericModal()">✕</button></div>
      <div id="langQuizBox" style="margin-top:10px;"></div>
    `);
    renderInlineMCQ('langQuizBox', q, (correct)=>{ if(correct) score++; setTimeout(()=>{ idx++; next(); }, 900); });
  }
  next();
}
function buildLangQuizQuestions(pool, count){
  const shuffled = shuffle([...pool]);
  const picks = shuffled.slice(0, count);
  return picks.map(item=>{
    const distractors = shuffle(pool.filter(p=>p.id!==item.id)).slice(0,2).map(p=>p.target);
    const options = shuffle([item.target, ...distractors]);
    return { q:`How do you say "${item.en}"?`, options, answer: options.indexOf(item.target) };
  });
}

/* ---- Audio recording (hear-yourself-back), separate from the SpeechRecognition transcript ---- */
let activeMediaStream = null, activeMediaRecorder = null, recordedChunks = [];
function startAudioRecording(onReady){
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || typeof MediaRecorder==='undefined'){
    onReady(null); return;
  }
  navigator.mediaDevices.getUserMedia({audio:true}).then(stream=>{
    activeMediaStream = stream; recordedChunks = [];
    try{ activeMediaRecorder = new MediaRecorder(stream); }catch(e){ onReady(null); stream.getTracks().forEach(t=>t.stop()); return; }
    activeMediaRecorder.ondataavailable = e=>{ if(e.data && e.data.size>0) recordedChunks.push(e.data); };
    activeMediaRecorder.onstop = ()=>{
      const blob = new Blob(recordedChunks, {type: activeMediaRecorder.mimeType || 'audio/webm'});
      const url = recordedChunks.length ? URL.createObjectURL(blob) : null;
      stream.getTracks().forEach(t=>t.stop());
      onReady(url);
    };
    activeMediaRecorder.start();
  }).catch(()=>{ onReady(null); });
}
function stopAudioRecording(){
  if(activeMediaRecorder && activeMediaRecorder.state !== 'inactive'){ activeMediaRecorder.stop(); }
}

      <div id="speakFeedback" style="margin-top:16px;"></div>
    </div>
  `;
  document.getElementById('speakTopicSelect').addEventListener('change', e=>{ speakState.topicId=e.target.value; speakState.sentenceIdx=0; renderSpeak(); });
  document.getElementById('speakTeacherSelect').addEventListener('change', e=>{ speakState.teacherId=e.target.value; renderSpeak(); });
  wireVoiceGenderToggle('speak', ()=>{});
  document.querySelectorAll('[data-jump]').forEach(b=>b.addEventListener('click', ()=>{ speakState.sentenceIdx = parseInt(b.getAttribute('data-jump')); renderSpeak(); }));
  document.querySelectorAll('[data-speed]').forEach(b=>b.addEventListener('click', ()=>{
    const opt = SPEED_OPTIONS.find(s=>s.key===b.getAttribute('data-speed'));
    state.speakRate = opt.rate; saveState(); renderSpeak();
  }));
  document.getElementById('speakListenBtn').addEventListener('click', ()=> speak(topic.sentences[speakState.sentenceIdx], englishVoiceFor(teacher)) );
  document.getElementById('speakRepeatBtn').addEventListener('click', ()=> speak(topic.sentences[speakState.sentenceIdx], englishVoiceFor(teacher)) );
  document.getElementById('speakPrevBtn').addEventListener('click', ()=>{
    if(speakState.sentenceIdx>0){ speakState.sentenceIdx--; renderSpeak(); }
  });
  document.getElementById('speakNextBtn').addEventListener('click', ()=>{
    speakState.sentenceIdx = (speakState.sentenceIdx+1) % topic.sentences.length;
    renderSpeak();
  });
  document.getElementById('speakRecordBtn').addEventListener('click', ()=>{
    const fb = document.getElementById('speakFeedback');
    const btn = document.getElementById('speakRecordBtn');
    btn.textContent = '⏺ Listening...'; btn.disabled = true;
    fb.innerHTML = '';
    let lastHeard = null, lastMatch = null, audioUrl = null;
    function paint(){
      fb.innerHTML = `
        ${lastHeard!==null ? `<div class="card" style="background:var(--surface-2);text-align:left;">
          <p style="font-size:12px;">You said:</p><p style="color:var(--text);font-weight:600;">"${esc(lastHeard)}"</p>
          <p style="font-size:11px;margin-top:8px;">Approximate word match with the model sentence — not a certified pronunciation score.</p>
          <div class="progress-track" style="margin-top:6px;"><div class="progress-fill" style="width:${lastMatch}%;"></div></div>
        </div>` : ''}
        ${audioUrl ? `<div style="margin-top:10px;"><p style="font-size:11.5px;margin-bottom:4px;">Hear yourself back:</p><audio controls src="${audioUrl}" style="width:100%;"></audio></div>` : ''}
      `;
    }
    startAudioRecording((url)=>{ audioUrl = url; paint(); });
    startRecognition('en-US', (heard)=>{
      const target = topic.sentences[speakState.sentenceIdx].toLowerCase().replace(/[.?!,]/g,'').replace(/___/g,'').trim();
      const said = heard.toLowerCase().replace(/[.?!,]/g,'').trim();
      const targetWords = target.split(/\s+/).filter(Boolean);
      const saidWords = said.split(/\s+/);
      const matched = targetWords.filter(w=>saidWords.includes(w)).length;
      lastHeard = heard;
      lastMatch = targetWords.length ? Math.round((matched/targetWords.length)*100) : 0;
      addPoints(3);
      markSentencePracticed(speakState.topicId, speakState.sentenceIdx);
      paint();
    }, ()=>{
      btn.textContent='🎤 Practise this'; btn.disabled=false;
      stopAudioRecording();
    });
  });
}

        toast('New personal best streak!','success');

      addPoints(score*2);

    </div>
    <div id="${containerId}-result" style="margin-top:8px;font-size:13px;"></div>`;
  box.querySelectorAll('[data-opt]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const i = parseInt(btn.getAttribute('data-opt'));
      const correct = i===item.answer;
      box.querySelectorAll('[data-opt]').forEach(b=>b.disabled=true);
      btn.style.borderColor = correct? 'var(--success)':'var(--danger)';
      btn.style.color = correct? 'var(--success)':'var(--danger)';
      document.getElementById(containerId+'-result').innerHTML = correct
        ? `<span style="color:var(--success);font-weight:700;">✓ Correct!</span>${item.explain?' '+esc(item.explain):''}`
        : `<span style="color:var(--danger);font-weight:700;">✕ Not quite.</span> Correct answer: <b>${esc(item.options[item.answer])}</b>. ${item.explain?esc(item.explain):''}`;
      if(correct) addPoints(2);
      try{ v7ExternalAnswer(containerId, item, correct); }catch(e){}
      if(onAnswered) onAnswered(correct);
    });
  });
}

  document.getElementById('vocabQuizBtn').addEventListener('click', startVocabFlashcardQuiz);
  renderVocabGrid();

function renderVocabGrid(){
  let list = vocabCatFilter==='All' ? VOCABULARY : VOCABULARY.filter(v=>v.category===vocabCatFilter);
  if(vocabShowFavOnly) list = list.filter(v=>state.progress.vocabFavorites.includes(v.id));
  const term = vocabSearchTerm.trim().toLowerCase();
  if(term) list = list.filter(v=> v.word.toLowerCase().includes(term) || v.meaning.toLowerCase().includes(term));
  document.getElementById('vocabGrid').innerHTML = list.map(v=>{
    const fav = state.progress.vocabFavorites.includes(v.id);
    return `<div class="card">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;">
        <h4 style="margin:0;">${esc(v.word)}</h4>
        <button class="icon-btn" style="width:32px;height:32px;font-size:15px;" data-fav="${v.id}">${fav?'⭐':'☆'}</button>
      </div>
      <p style="font-size:12px;margin-top:4px;">${esc(v.pronunciation)}</p>
      <p style="font-size:13.5px;color:var(--text);margin-top:6px;">${esc(v.meaning)}</p>
      <p style="font-size:12px;margin-top:4px;">${esc(v.translation)}</p>
      <p style="font-size:12.5px;font-style:italic;margin-top:6px;">"${esc(v.example)}"</p>
      <button class="btn btn-soft btn-sm" style="width:100%;margin-top:10px;" data-play="${v.id}">🔊 Listen</button>
    </div>`;
  }).join('') || `<div class="empty-state"><span class="ic">🧠</span>No words match — try another search or filter.</div>`;
  document.querySelectorAll('[data-fav]').forEach(b=>b.addEventListener('click', ()=>{
    const id = b.getAttribute('data-fav');
    const arr = state.progress.vocabFavorites;
    const idx = arr.indexOf(id);
    if(idx>-1) arr.splice(idx,1); else { arr.push(id); if(!state.progress.vocabLearned.includes(id)){ state.progress.vocabLearned.push(id); addPoints(1);} }
    saveState(); renderVocabGrid();
  }));
  document.querySelectorAll('[data-play]').forEach(b=>b.addEventListener('click', ()=>{
    const v = VOCABULARY.find(x=>x.id===b.getAttribute('data-play'));
    speak(v.word+'. '+v.example, 'en-US');
    if(!state.progress.vocabLearned.includes(v.id)){ state.progress.vocabLearned.push(v.id); saveState(); }
  }));
}
function startVocabFlashcardQuiz(){
  const pool = VOCABULARY.filter(v=>state.progress.vocabFavorites.includes(v.id));
  if(!pool.length){
    toast('Star some words as favourites first to build a flashcard deck.','error');
    return;
  }
  const deck = shuffle([...pool]);
  let idx = 0, revealed = false, correctCount = 0;
  function renderCard(){
    if(idx >= deck.length){
      showGenericModal(`
        <div class="modal-head"><h3>🃏 Flashcard Quiz</h3><button class="icon-btn" onclick="closeGenericModal()">✕</button></div>
        <div style="text-align:center;padding:20px 0;">
          <div style="font-size:38px;">🎉</div>
          <h2 style="margin-top:10px;">${correctCount} / ${deck.length}</h2>
          <p>Nice revision! Points added to your progress.</p>
          <button class="btn btn-primary" style="margin-top:14px;" onclick="closeGenericModal()">Done</button>
        </div>
      `);
      return;
    }
    const v = deck[idx];
    revealed = false;
    showGenericModal(`
      <div class="modal-head"><span class="pill pill-blue">Card ${idx+1}/${deck.length}</span><button class="icon-btn" onclick="closeGenericModal()">✕</button></div>
      <div class="card" style="background:var(--surface-2);text-align:center;margin-top:10px;min-height:120px;display:flex;flex-direction:column;align-items:center;justify-content:center;">
        <h2 style="margin:0;">${esc(v.word)}</h2>
        <p style="font-size:12.5px;margin-top:6px;">${esc(v.pronunciation)}</p>
        <div id="fcReveal" style="margin-top:12px;"></div>
      </div>
      <div style="display:flex;gap:8px;justify-content:center;margin-top:16px;flex-wrap:wrap;" id="fcActions">
        <button class="btn btn-outline btn-sm" id="fcPlayBtn">🔊 Hear it</button>
        <button class="btn btn-primary btn-sm" id="fcRevealBtn">Reveal meaning</button>
      </div>
    `);
    document.getElementById('fcPlayBtn').addEventListener('click', ()=> speak(v.word, 'en-US'));
    document.getElementById('fcRevealBtn').addEventListener('click', ()=>{
      revealed = true;
      document.getElementById('fcReveal').innerHTML = `<p style="color:var(--text);font-weight:600;">${esc(v.meaning)}</p><p style="font-size:12.5px;font-style:italic;margin-top:4px;">"${esc(v.example)}"</p>`;
      document.getElementById('fcActions').innerHTML = `
        <button class="btn btn-danger-soft btn-sm" id="fcNoBtn">✕ Didn't know it</button>
        <button class="btn btn-primary btn-sm" id="fcYesBtn">✓ Knew it</button>
      `;
      document.getElementById('fcNoBtn').addEventListener('click', ()=>{ idx++; renderCard(); });
      document.getElementById('fcYesBtn').addEventListener('click', ()=>{ correctCount++; addPoints(2); idx++; renderCard(); });
    });
  }
  renderCard();
}

  renderQ();

function shuffle(arr){ for(let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; } return arr; }

function startWordScramble(){
  const pool = VOCABULARY.filter(v=>!v.word.includes(' ') && v.word.length>=3);
  const rounds = shuffle([...pool]).slice(0,8);
  let idx = 0, score = 0, picked = [];
  function renderRound(){
    if(idx >= rounds.length){
      if(score > (state.progress.gameHighScore||0)){ state.progress.gameHighScore = score; saveState(); toast('New high score!','success'); }
      addPoints(score*2);
      checkBadges();
      saveState();
      showGenericModal(`
        <div class="modal-head"><h3>🔤 Word Scramble</h3><button class="icon-btn" onclick="closeGenericModal();renderGames();">✕</button></div>
        <div style="text-align:center;padding:20px 0;">
          <div style="font-size:38px;">🎉</div>
          <h2 style="margin-top:10px;">${score} / ${rounds.length}</h2>
          <p>Nice work! Points added to your progress.</p>
          <button class="btn btn-primary" style="margin-top:14px;" onclick="closeGenericModal();renderGames();">Done</button>
        </div>
      `);
      return;
    }
    const v = rounds[idx];
    const word = v.word.toUpperCase();
    const tiles = shuffle(word.split(''));
    picked = [];
    showGenericModal(`
      <div class="modal-head"><span class="pill pill-blue">Word ${idx+1}/${rounds.length}</span><button class="icon-btn" onclick="closeGenericModal()">✕</button></div>
      <p style="font-size:13px;margin-top:8px;">💡 Hint: ${esc(v.meaning)}</p>
      <div id="scrambleBuilt" style="min-height:44px;padding:10px;border:1.5px dashed var(--border);border-radius:10px;font-size:22px;letter-spacing:4px;text-align:center;margin:10px 0;color:var(--text);font-weight:700;"></div>
      <div class="chip-select" id="scrambleTiles" style="justify-content:center;">${tiles.map((l,i)=>`<button type="button" class="chip-opt" data-letter="${esc(l)}" data-tileidx="${i}" style="font-size:18px;font-weight:700;min-width:40px;">${esc(l)}</button>`).join('')}</div>
      <div style="display:flex;gap:8px;margin-top:14px;justify-content:center;">
        <button class="btn btn-soft btn-sm" id="scrambleResetBtn">Reset</button>
        <button class="btn btn-soft btn-sm" id="scrambleSkipBtn">Skip</button>
      </div>
      <div id="scrambleResult" style="margin-top:10px;text-align:center;font-size:13px;"></div>
    `);
    const builtBox = document.getElementById('scrambleBuilt');
    const tilesRow = document.getElementById('scrambleTiles');
    function updateBuilt(){
      builtBox.textContent = picked.map(p=>p.letter).join('');
      if(picked.length === word.length){
        const said = picked.map(p=>p.letter).join('');
        if(said === word){
          score++;
          document.getElementById('scrambleResult').innerHTML = '<span style="color:var(--success);font-weight:700;">✓ Correct!</span>';
          setTimeout(()=>{ idx++; renderRound(); }, 800);
        } else {
          document.getElementById('scrambleResult').innerHTML = '<span style="color:var(--danger);font-weight:700;">✕ Not quite — tap Reset to try again.</span>';
        }
      }
    }
    tilesRow.addEventListener('click', e=>{
      const btn = e.target.closest('[data-letter]'); if(!btn || btn.disabled) return;
      picked.push({letter:btn.getAttribute('data-letter'), tileidx:btn.getAttribute('data-tileidx')});
      btn.disabled = true; btn.style.opacity = '.3';
      updateBuilt();
    });
    document.getElementById('scrambleResetBtn').addEventListener('click', ()=>{ renderRound(); });
    document.getElementById('scrambleSkipBtn').addEventListener('click', ()=>{ idx++; renderRound(); });
  }
  renderRound();
}

        </div>`;

function buildAdventureQuestions(level, count){
  const lessonQs = LESSONS.filter(l=>l.level===level).flatMap(l=>l.practice);
  const grammarQs = GRAMMAR_TOPICS.filter(g=>g.level===level).flatMap(g=>g.quiz);
  let pool = shuffle([...lessonQs, ...grammarQs]);
  if(pool.length < count){
    const vocabExtra = shuffle([...VOCABULARY]).slice(0, count-pool.length).map(v=>{
      const distractors = shuffle(VOCABULARY.filter(x=>x.id!==v.id)).slice(0,2).map(x=>x.meaning);
      const options = shuffle([v.meaning, ...distractors]);
      return {q:`What does "${v.word}" mean?`, options, answer: options.indexOf(v.meaning)};
    });
    pool = [...pool, ...vocabExtra];
  }
  return shuffle(pool).slice(0,count);
}
let adventureBattle = null;
function startAdventureBattle(locId, creatureId){
  const loc = ADVENTURE_LOCATIONS.find(l=>l.id===locId);
  const creature = loc.creatures.find(c=>c.id===creatureId);
  const questions = loc.subject==='vedic'
    ? shuffle([...VEDIC_QUESTIONS]).slice(0,8).map(q=>({q:q.q, options:q.options, answer:q.answer}))
    : buildAdventureQuestions(loc.level, 8);
  adventureBattle = {
    locId, creatureId, creatureName:creature.name, creatureIcon:creature.icon,
    hp: creature.hp, maxHp: creature.hp, hearts: 3,
    questions, qIdx: 0
  };
  renderAdventureBattle();
}
function renderAdventureBattle(){
  const b = adventureBattle;
  if(b.qIdx >= b.questions.length && b.hp > 0){
    // Ran out of prepared questions before defeating — refresh the question pool
    const loc = ADVENTURE_LOCATIONS.find(l=>l.id===b.locId);
    b.questions = loc.subject==='vedic'
      ? shuffle([...VEDIC_QUESTIONS]).slice(0,8).map(q=>({q:q.q, options:q.options, answer:q.answer}))
      : buildAdventureQuestions(loc.level, 8);
    b.qIdx = 0;
  }
  const hpPct = Math.max(0, Math.round((b.hp/b.maxHp)*100));
  showGenericModal(`
    <div class="modal-head"><span class="pill pill-purple">⚔️ Battle</span><button class="icon-btn" onclick="closeGenericModal();adventureBattle=null;">✕</button></div>
    <div style="text-align:center;margin-top:8px;">
      <div style="font-size:44px;">${b.creatureIcon}</div>
      <h3 style="margin-top:6px;">${esc(b.creatureName)}</h3>
      <div class="progress-track" style="margin-top:8px;"><div class="progress-fill" style="width:${hpPct}%;background:linear-gradient(135deg,#EF4444,#F5A623);"></div></div>
      <p style="font-size:11.5px;margin-top:4px;">${Math.max(0,b.hp)}/${b.maxHp} HP</p>
      <p style="font-size:16px;margin-top:8px;">${'❤️'.repeat(b.hearts)}${'🖤'.repeat(3-b.hearts)}</p>
    </div>
    <div id="battleQuizBox" style="margin-top:14px;"></div>
  `);
  const q = b.questions[b.qIdx];
  renderInlineMCQ('battleQuizBox', q, (correct)=>{
    if(correct){
      b.hp -= 10;
      b.qIdx++;
      if(b.hp <= 0){ setTimeout(()=>battleVictory(), 700); return; }
      setTimeout(()=>renderAdventureBattle(), 700);
    } else {
      b.hearts--;
      b.qIdx++;
      if(b.hearts <= 0){ setTimeout(()=>battleDefeat(), 700); return; }
      setTimeout(()=>renderAdventureBattle(), 900);
    }
  });
}
function battleVictory(){
  const b = adventureBattle;
  if(!state.progress.adventureMap.defeatedCreatures.includes(b.creatureId)){
    state.progress.adventureMap.defeatedCreatures.push(b.creatureId);
    addPoints(8);
    checkBadges();
    saveState();
  }
  const loc = ADVENTURE_LOCATIONS.find(l=>l.id===b.locId);
  const locCleared = loc.creatures.every(c=>state.progress.adventureMap.defeatedCreatures.includes(c.id));
  showGenericModal(`
    <div class="modal-head"><h3>🎉 Victory!</h3><button class="icon-btn" onclick="closeGenericModal();adventureBattle=null;renderAdventureMap();">✕</button></div>
    <div style="text-align:center;padding:16px 0;">
      <div style="font-size:44px;">🏆</div>
      <h3 style="margin-top:10px;">${esc(b.creatureName)} defeated!</h3>
      <p style="font-size:13px;margin-top:6px;">+8 points added to your progress.</p>
      ${locCleared ? `<p style="font-size:13px;margin-top:10px;color:var(--success);font-weight:700;">✓ ${esc(loc.name)} cleared — next location unlocked!</p>` : ''}
      <button class="btn btn-primary" style="margin-top:16px;" onclick="closeGenericModal();adventureBattle=null;renderAdventureMap();">Continue</button>
    </div>
  `);
}
function battleDefeat(){
  const b = adventureBattle;
  showGenericModal(`
    <div class="modal-head"><h3>💫 Not This Time</h3><button class="icon-btn" onclick="closeGenericModal();adventureBattle=null;renderAdventureMap();">✕</button></div>
    <div style="text-align:center;padding:16px 0;">
      <div style="font-size:44px;">🛡️</div>
      <h3 style="margin-top:10px;">${esc(b.creatureName)} held its ground</h3>
      <p style="font-size:13px;margin-top:6px;">No points lost — review the topic and try again whenever you're ready!</p>
      <button class="btn btn-primary" style="margin-top:16px;" onclick="closeGenericModal();startAdventureBattle('${b.locId}','${b.creatureId}')">Try Again</button>
      <button class="btn btn-soft" style="margin-top:8px;" onclick="closeGenericModal();adventureBattle=null;renderAdventureMap();">Back to Map</button>
    </div>
  `);
}

let parentZoneUnlocked = false; // resets each session — must re-enter PIN after reload
function renderParentZone(){
  if(!state.parentPin && !parentZoneUnlocked){ renderParentZoneSetup(); return; }
  if(state.parentPin && !parentZoneUnlocked){ renderParentZoneLock(); return; }
  renderParentZoneContent();
}
function renderParentZoneSetup(){
  document.getElementById('view-parentzone').innerHTML = `
    <div class="page-head"><h2>👪 Parent Zone</h2><p>Protect this area with a 4-digit PIN so only a parent or guardian can view it.</p></div>
    <div class="card" style="max-width:420px;">
      <label class="field-label" style="margin-top:0;">Set a 4-digit PIN</label>
      <input type="text" inputmode="numeric" maxlength="4" id="pzSetupPin" placeholder="e.g. 1234">
      <button class="btn btn-primary" style="width:100%;margin-top:14px;" id="pzSetupBtn">Set PIN & Continue</button>
      <button class="btn btn-soft" style="width:100%;margin-top:8px;" id="pzSkipBtn">Skip for now</button>
    </div>
  `;
  document.getElementById('pzSetupBtn').addEventListener('click', ()=>{
    const val = document.getElementById('pzSetupPin').value.trim();
    if(!/^\d{4}$/.test(val)){ toast('Enter a 4-digit PIN.','error'); return; }
    state.parentPin = val;
    parentZoneUnlocked = true;
    saveState();
    toast('PIN set','success');
    renderParentZone();
  });
  document.getElementById('pzSkipBtn').addEventListener('click', ()=>{
    parentZoneUnlocked = true;
    renderParentZone();
  });
}
function renderParentZoneLock(){
  document.getElementById('view-parentzone').innerHTML = `
    <div class="page-head"><h2>👪 Parent Zone</h2><p>Enter your PIN to continue.</p></div>
    <div class="card" style="max-width:420px;">

      <button class="btn btn-primary" style="width:100%;margin-top:14px;" id="pzUnlockBtn">Unlock</button>
      <p style="font-size:11.5px;margin-top:10px;">Forgot your PIN? Reset it from Settings → Data.</p>
    </div>
  `;
  const tryUnlock = ()=>{
    const val = document.getElementById('pzEnterPin').value.trim();
    if(val === state.parentPin){ parentZoneUnlocked = true; renderParentZone(); }
    else toast('Incorrect PIN.','error');
  };
  document.getElementById('pzUnlockBtn').addEventListener('click', tryUnlock);
  document.getElementById('pzEnterPin').addEventListener('keydown', e=>{ if(e.key==='Enter') tryUnlock(); });
}

function last7Days(){
  const days=[];
  for(let i=6;i>=0;i--){ const d=new Date(); d.setDate(d.getDate()-i); days.push({iso:d.toISOString().slice(0,10), label:d.toLocaleDateString('en-US',{weekday:'short'}).slice(0,2)}); }
  return days;
}

      </div>

      <input type="text" id="set-name" value="${esc(d.name)}">
      <label class="field-label">Age group / class</label>
      ${chipGroup('set-ageGroup', AGE_GROUPS, d.ageGroup)}
      <label class="field-label">English proficiency level</label>
      ${chipGroup('set-level', LEVELS, d.level)}
      <label class="field-label">Learning objective</label>
      ${chipGroup('set-objective', OBJECTIVES, d.objective)}
      <label class="field-label">Preferred English accent</label>
      ${chipGroup('set-accent', ACCENTS, d.accent)}
      <label class="field-label">Preferred explanation language</label>
      ${chipGroup('set-explainLang', EXPLAIN_LANGS, d.explainLang)}
      <label class="field-label">Daily practice duration (minutes)</label>
      ${chipGroup('set-dailyMinutes', DURATIONS.map(String), String(d.dailyMinutes))}
      <button class="btn btn-primary" style="width:100%;margin-top:18px;" id="profileSaveBtn">Save Changes</button>
    </div>
  `;
  let selectedAvatar = d.avatar;
  document.getElementById('avatarPickRow').addEventListener('click', e=>{
    const btn = e.target.closest('[data-avatar]'); if(!btn) return;
    selectedAvatar = btn.getAttribute('data-avatar');
    document.querySelectorAll('#avatarPickRow .chip-opt').forEach(c=>c.classList.remove('selected'));
    btn.classList.add('selected');
  });
  document.querySelectorAll('#view-profile .chip-select').forEach(group=>{
    if(group.id==='avatarPickRow') return;
    group.addEventListener('click', e=>{
      const btn = e.target.closest('.chip-opt'); if(!btn) return;
      group.querySelectorAll('.chip-opt').forEach(c=>c.classList.remove('selected'));
      btn.classList.add('selected');
    });
  });
  document.getElementById('profileSaveBtn').addEventListener('click', ()=>{
    const get = (g)=> document.querySelector(`[data-group="${g}"] .chip-opt.selected`).getAttribute('data-value');

    state.profile.accent = get('set-accent');
    state.profile.explainLang = get('set-explainLang');
    state.profile.dailyMinutes = parseInt(get('set-dailyMinutes'));
    saveState();
    updateProfileChip();
    toast('Profile saved','success');
    renderProfile();
  });
}

/* ---------- seeded RNG (lets the Daily Challenge pick the same topics all day) ---------- */
let _seed = null;
function _rnd(){
  if(_seed===null) return Math.random();
  _seed = (Math.imul(_seed, 1664525) + 1013904223) >>> 0;
  return _seed / 4294967296;
}
function seedRnd(n){ _seed = (n>>>0) || 1; }
function unseedRnd(){ _seed = null; }
function rInt(a,b){ return a + Math.floor(_rnd()*(b-a+1)); }
function rPick(arr){ return arr[Math.floor(_rnd()*arr.length)]; }
function rShuf(arr){ const a = arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(_rnd()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function hashStr(s){ let h=5381; s=String(s); for(let i=0;i<s.length;i++){ h=((h<<5)+h+s.charCodeAt(i))|0; } return String(h>>>0); }
function pad2(n){ return n<10?'0'+n:''+n; }
function localISO(d){ return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function daysBetween(isoA, isoB){ return Math.round((new Date(isoB+'T00:00:00') - new Date(isoA+'T00:00:00'))/86400000); }
function weekStartISO(d){ const x=new Date(d||Date.now()); const wd=(x.getDay()+6)%7; x.setDate(x.getDate()-wd); return localISO(x); }
function fmtMoney(n){ return '₹'+Number(n).toLocaleString('en-IN'); }
function fmtNum(n){ return String(+Number(n).toFixed(2)); }

const BAND_INFO = {
  '2-4':    {label:'Ages 2–4',  emoji:'🧸', blurb:'Songs, colours, animals and first words.'},
  '4-6':    {label:'Ages 4–6',  emoji:'🌈', blurb:'Letters, numbers, shapes and play.'},
  '6-10':   {label:'Ages 6–10', emoji:'🚀', blurb:'Reading, maths, science and puzzles.'},
  '10-14':  {label:'Ages 10–14',emoji:'🧠', blurb:'Reasoning, science, GK and money skills.'},
  'Student':{label:'Student',   emoji:'🎓', blurb:'Exam-ready practice and real-world skills.'},
  'Adult':  {label:'Adult',     emoji:'💼', blurb:'Everyday maths, money skills and communication.'}
};
function bandFromAge(age){
  if(age==null || isNaN(age)) return null;
  if(age<=3) return '2-4';
  if(age<=5) return '4-6';
  if(age<=9) return '6-10';
  if(age<=13) return '10-14';
  if(age<=21) return 'Student';
  return 'Adult';
}
function bandFromGroup(g){
  return ({'Pre-school':'4-6','Class 1-5':'6-10','Class 6-10':'10-14','Class 11-12':'Student','College':'Student','Working Professional':'Adult','Adult':'Adult'})[g] || 'Adult';
}
function deriveBand(age, group){
  let b = bandFromAge(age);
  if(!b) return bandFromGroup(group);
  if(b==='Adult' && (group==='College' || group==='Class 11-12')) b='Student';
  return b;
}
function bandIdx(b){ const i = BAND_LIST.indexOf(b || (state.v7 && state.v7.band) || 'Adult'); return i<0?5:i; }
function isYoung(){ return bandIdx()<=1; }

const TOPICS = {};
/* bands = [minBandIdx, maxBandIdx]; gen(level 1-3, simple) -> question object */
function regTopic(key, subject, title, icon, bands, gen, extra){

/* ---------- question builders (used by generators) ---------- */
function mk(q, correct, wrongs, explain, extra){
  const uniq = [];
  [correct, ...wrongs].forEach(o=>{ const s=String(o); if(!uniq.includes(s)) uniq.push(s); });
  const opts = rShuf(uniq);
  return Object.assign({q, options:opts, answer:opts.indexOf(String(correct)), explain:explain||''}, extra||{});
}
function numQ(q, correct, explain, extra, fmt, nWrong){
  const f = fmt || (x=>String(x));
  const base = Math.max(1, Math.abs(correct));
  const step = Math.max(1, Math.round(base*0.1));
  const deltas = rShuf([1,-1,2,-2,3,-3,5,-5,10,-10,step,-step,2*step,-2*step,100,-100,20,-20]);
  const wrongs = [];
  const want = nWrong || 3;
  for(const d of deltas){
    if(Math.abs(d) > Math.max(5, base*2)) continue;
    const v = correct + d;
    if(v===correct) continue;
    if(v<0 && correct>=0) continue;
    const s = f(v);
    if(s===f(correct) || wrongs.includes(s)) continue;
    wrongs.push(s);
    if(wrongs.length>=want) break;
  }
  return mk(q, f(correct), wrongs, explain, extra);
}
/* static pool helper: entries are [lvl, question, correct, [wrongs], explanation, visual?] */
function poolGen(entries){
  const items = entries.map(e=>({l:e[0], q:e[1], a:e[2], w:e[3], e:e[4], v:e[5]}));
  return function(lvl, simple){
    const want = simple ? 1 : lvl;
    let cands = items.filter(i=>i.l===want);
    if(!cands.length){ cands = items.slice().sort((x,y)=>Math.abs(x.l-want)-Math.abs(y.l-want)); cands = cands.filter(i=>i.l===cands[0].l); }
    const it = rPick(cands);
    return mk(it.q, it.a, it.w, it.e, it.v ? {visual:it.v} : {});
  };
}
function validQ(q){
  return q && Array.isArray(q.options) && q.options.length>=2 && q.answer>=0 && q.answer<q.options.length && typeof q.q==='string';
}

/* ---------- mastery ---------- */
function mstat(key){
  const m = state.v7.mastery[key];
  if(!m) return {a:0, c:0, acc:null, lvl:startLevel(), weak:false, mastered:false, last:null};
  const r = m.recent;
  const acc = r.length ? r.reduce((s,x)=>s+x,0)/r.length : null;
  return {a:m.a, c:m.c, acc, lvl:m.lvl, last:m.last,
          weak: m.a>=3 && acc!==null && acc<0.6,
          mastered: m.a>=10 && r.length>=8 && acc>=0.9 && m.lvl>=3};
}
function curLevel(key){ return mstat(key).lvl; }
function lvlLabel(l){ return l===1?'Easy':l===2?'Medium':'Hard'; }
function lvlClass(l){ return l===1?'lvl-easy':l===2?'lvl-med':'lvl-hard'; }
function missedFor(key){ return state.v7.missed.filter(m=>m.topic===key); }
function daysSinceLast(key){ const s=mstat(key); return s.last ? daysBetween(s.last, todayStr()) : null; }

function genQ(key, lvl, simple){
  const t = TOPICS[key];
  const m = state.v7.mastery[key];
  const seen = m ? m.seen : [];
  let q = null;
  for(let i=0;i<8;i++){
    q = t.gen(lvl, !!simple);
    if(!validQ(q)) { q=null; continue; }
    q.id = hashStr(key+'|'+q.q+'|'+(q.visual||'')+'|'+q.options[q.answer]);
    if(!seen.includes(q.id)) break;
  }
  if(!q) throw new Error('Question generator failed for '+key);
  q.topic = key; q.level = lvl;
  return q;
}

function recordAnswer(q, ok){
  const v = state.v7, key = q.topic;
  const before = mstat(key);
  const m = v.mastery[key] || (v.mastery[key] = {a:0,c:0,lvl:startLevel(),streak:0,wr:0,recent:[],seen:[],last:null});
  m.a++; if(ok) m.c++;
  m.recent.push(ok?1:0); if(m.recent.length>10) m.recent.shift();
  if(q.id){ m.seen.push(q.id); if(m.seen.length>30) m.seen.shift(); }
  m.last = todayStr();
  let up=false, down=false;
  if(ok){ m.streak++; m.wr=0; if(m.streak>=3 && m.lvl<3){ m.lvl++; m.streak=0; up=true; } }
  else { m.streak=0; m.wr++; if(m.wr>=2 && m.lvl>1){ m.lvl--; m.wr=0; down=true; } }
  // missed-question memory (for Today's Learning review slots)
  if(q.id){
    const idx = v.missed.findIndex(x=>x.id===q.id);
    if(ok){ if(idx>=0) v.missed.splice(idx,1); }
    else if(idx<0 && q.options){
      v.missed.push({id:q.id, topic:key, q:q.q, options:q.options, answer:q.answer, explain:q.explain||'', visual:q.visual||'', say:q.say||'', level:q.level||1, ts:Date.now()});
      if(v.missed.length>40) v.missed.shift();
    }
  }
  const t = TOPICS[key]; const sj = t ? t.subject : 'misc';
  if(!v.subj[sj]) v.subj[sj] = {a:0,c:0};
  v.subj[sj].a++; if(ok) v.subj[sj].c++;
  const ds = dayEntry(); ds.a++; if(ok) ds.c++;
  const days = Object.keys(v.dayStats); if(days.length>120){ days.sort(); days.slice(0,days.length-120).forEach(k=>delete v.dayStats[k]); }
  const w = weekEntry(); w.q++; if(ok) w.c++; if(!w.subjects.includes(sj)) w.subjects.push(sj);
  const after = mstat(key);
  saveState();
  return {up, down, newlyMastered: !before.mastered && after.mastered};
}

let QZ = null;
function slotsFor(key, n, extra){ const a=[]; for(let i=0;i<n;i++) a.push(Object.assign({topic:key}, extra||{})); return a; }
function startTopicQuiz(key, n, levelOverride){

function startQuiz(opts){
  ensureV7();
  QZ = {opts, slots:opts.slots.slice(), i:0, correct:0, answered:0, xp:0, sessWrong:{}, extra:0, changes:{}, mastered:[],
        startedAt:Date.now(), cur:null, locked:false, token:Math.random(), memoryShown:false, timer:null, topicsSeen:[]};

function quizExit(){
  if(QZ){ clearTimeout(QZ.timer); QZ=null; }

}
function quizModalOpen(){ return !document.getElementById('genericModal').classList.contains('hidden'); }
function renderQuizQ(){
  const Z = QZ; if(!Z) return;
  if(Z.i >= Z.slots.length){ finishQuiz(); return; }
  const slot = Z.slots[Z.i];
  let q;
  if(slot.replay){
    q = Object.assign({}, slot.replay); q.isReplay = true;
  } else {
    let lvl = slot.level || Z.opts.levelOverride || curLevel(slot.topic);
    if(slot.simple) lvl = Math.max(1, Math.min(lvl, 2)-1);
    q = genQ(slot.topic, lvl, slot.simple);
    if(slot.simple) q.isSimple = true;
  }
  Z.cur = q; Z.locked = false; Z.memoryShown = false;
  if(!Z.topicsSeen.includes(q.topic)) Z.topicsSeen.push(q.topic);
  drawQuizQ();
}
function drawQuizQ(){
  const Z = QZ; if(!Z) return;
  const q = Z.cur, t = TOPICS[q.topic] || {title:'Quiz', icon:'🎯'};
  const total = Z.slots.length;
  const head = `
    <div class="modal-head">
      <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;">
        <span class="pill pill-blue">Q${Z.i+1}/${total}</span>
        <span class="pill pill-purple">${t.icon||''} ${esc(t.title)}</span>

function quizAnswer(i){
  const Z = QZ; if(!Z || Z.locked) return;
  Z.locked = true;
  const q = Z.cur, ok = (i===q.answer);
  Z.answered++; if(ok) Z.correct++;
  const res = recordAnswer(q, ok);
  const xp = ok ? (1 + (q.level||1)) : 0;
  Z.xp += xp;
  if(xp) awardXP(xp);
  document.querySelectorAll('#qOpts .q-opt').forEach(b=>{
    const bi = parseInt(b.getAttribute('data-i')); b.disabled = true;
    if(bi===q.answer) b.classList.add('right');
    else if(bi===i) b.classList.add('wrong');
  });
  let note = '';
  if(res.up){ note += `<br>🔼 <b>Level up!</b> Questions in this topic are getting a little harder.`; Z.changes[q.topic]='up'; }
  if(res.down){ note += `<br>🔽 Let's slow down a little — easier questions coming up.`; Z.changes[q.topic]='down'; }
  if(res.newlyMastered){ note += `<br>🏆 <b>Topic mastered!</b> You'll see it less often now.`; Z.mastered.push(q.topic); }
  let more = '';
  if(!ok){
    Z.sessWrong[q.topic] = (Z.sessWrong[q.topic]||0) + 1;
    if(Z.sessWrong[q.topic]>=2 && !q.isReplay && Z.extra<4 && TOPICS[q.topic] && !TOPICS[q.topic].ext){
      Z.slots.splice(Z.i+1, 0, {topic:q.topic, simple:true});
      Z.extra++; Z.sessWrong[q.topic] = 0;
      more = `<br>🧩 Missed twice — here comes a simpler, similar question.`;
    }
  } else { Z.sessWrong[q.topic] = 0; }
  const fb = document.getElementById('qFeedback');
  fb.innerHTML = ok
    ? `<div class="q-feedback ok"><b class="t">✓ Correct! +${xp} XP</b>${esc(q.explain||'')}${note}</div><button class="btn btn-primary" style="width:100%;margin-top:10px;" id="qNext">Next →</button>`
    : `<div class="q-feedback bad"><b class="t">✕ Not quite.</b>Correct answer: <b>${q.optionsHtml?esc(q.options[q.answer]):esc(q.options[q.answer])}</b><br>💡 <b>Concept:</b> ${esc(q.explain||'Review this idea and try again soon.')}${note}${more}</div><button class="btn btn-primary" style="width:100%;margin-top:10px;" id="qNext">Next →</button>`;
  const go = ()=>{ if(QZ!==Z) return; clearTimeout(Z.timer); Z.i++; renderQuizQ(); };
  document.getElementById('qNext').addEventListener('click', go);
  if(ok && !note){ const tk = Z.token; Z.timer = setTimeout(()=>{ if(QZ && QZ.token===tk && quizModalOpen() && Z.locked){ go(); } }, 1400); }
}
function finishQuiz(){
  const Z = QZ; if(!Z) return;

  state.v7.sessions.push({d:todayStr(), k:o.kind, t:Z.topicsSeen.slice(0,6), s:Z.correct, n, secs});

  }

  if(o.kind==='daily'){

    weekEntry().daily++;
    let imp = avg===null ? 'First challenge on record — a great start!' :
      (pct>avg+1 ? `▲ ${Math.round(pct-avg)}% better than your recent average` : pct<avg-1 ? `▼ ${Math.round(avg-pct)}% below your recent average — you'll bounce back` : '＝ Right on your recent average');
    summary.improvement = imp;

    if(perfect) extraHTML += `<p style="margin-top:4px;">🌟 Perfect score bonus +10 XP</p>`;

  const weakNow = o.kind==='topic' ? (mstat(o.topic).weak ? [o.topic] : []) : Z.topicsSeen.filter(k=>mstat(k).weak && TOPICS[k] && !TOPICS[k].ext);
  const changed = Object.keys(Z.changes).filter(k=>TOPICS[k]).map(k=>`${TOPICS[k].icon} ${esc(TOPICS[k].title)} ${Z.changes[k]==='up'?'🔼 harder':'🔽 easier'}`);
  const again = o.kind==='topic' ? `<button class="btn btn-primary" onclick="startTopicQuiz('${o.topic}')">🔁 Practise again</button>` : '';
